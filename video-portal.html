<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EWC Video Portal</title>
<link rel="icon" type="image/svg+xml" href="easyway_icon.svg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root {
    --navy-950: #000000; --navy-900: #000000; --navy-800: #121212;
    --line: #262626; --paper: #ffffff; --text-muted: #a8a8a8;
    --amber-500: #e8a13a; --amber-400: #f2b854; --coral-500: #d9614f;
    --font-display: 'Rockwell', Georgia, serif; 
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px; background: var(--navy-950); color: var(--paper); font-family: var(--font-body); display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; }
  .portal-container { max-width: 600px; width: 100%; background: var(--navy-900); border: 1px solid var(--line); border-radius: 16px; padding: 30px; margin-top: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
  .header { text-align: center; border-bottom: 1px solid var(--line); padding-bottom: 20px; margin-bottom: 20px; }
  .header h1 { margin: 0; font-family: var(--font-display); font-size: 22px; color: var(--amber-400); }
  .header p { margin: 5px 0 0 0; font-size: 13px; color: var(--text-muted); }
  .video-upload-row { background: var(--navy-800); padding: 15px; border-radius: 8px; border: 1px solid var(--line); position: relative; margin-bottom: 10px; }
  .remove-vid-row { position: absolute; top: -10px; right: -10px; background: var(--coral-500); color: white; border: none; border-radius: 50%; width: 22px; height: 22px; cursor: pointer; font-weight: bold; line-height: 1; z-index: 10; }
  .input-group { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  input { background: var(--navy-900); border: 1px solid var(--line); color: var(--paper); border-radius: 6px; padding: 10px; font-size: 13px; width: 100%; }
  input[type="date"] { flex: 1; min-width: 120px; }
  input[type="url"] { flex: 2; min-width: 200px; }
  input[type="file"] { border: 1px dashed var(--line); padding: 12px; cursor: pointer; }
  .btn2 { border-radius: 8px; padding: 12px 14px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid var(--line); background: transparent; color: var(--paper); text-align: center; width: 100%; display: block; transition: 0.2s; }
  .btn2.primary { background: var(--amber-500); color: var(--navy-950); border: none; font-weight: bold; }
  .btn2:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>

<div class="portal-container">
  <div class="header">
    <div style="display:flex; justify-content:center; margin-bottom:10px;"><img src="easyway_icon.svg" style="width:40px; height:40px;"></div>
    <h1>Dedicated Video Portal</h1>
    <p>Upload video files directly to Google Drive (Max 30MB per video).</p>
  </div>

<!-- BACK BUTTON -->
  <button type="button" onclick="window.location.href='dashboard-employee.html'" style="background: transparent; border: none; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; gap: 5px; font-size: 13px; margin-bottom: 15px; padding: 0; font-family: var(--font-body); transition: color 0.2s;" onmouseover="this.style.color='var(--paper)'" onmouseout="this.style.color='var(--text-muted)'">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
    Return to Dashboard
  </button>
  
  <form id="dedicatedVideoForm">
    <div id="videoRowsContainer" style="display: flex; flex-direction: column; gap: 10px;">
      <div class="video-upload-row" style="background: var(--navy-800); padding: 15px; border-radius: 8px; border: 1px solid var(--line); position: relative;">
        <div style="display: flex; gap: 10px; margin-bottom: 8px; flex-wrap: wrap;">
          <input type="date" class="vid-date" required style="flex: 1; min-width: 110px; background: var(--navy-900); border: 1px solid var(--line); color: var(--paper); border-radius: 6px; padding: 10px;">
          <input type="url" class="vid-link" placeholder="TikTok Link (https://...)" required style="flex: 2; min-width: 180px; background: var(--navy-900); border: 1px solid var(--line); color: var(--paper); border-radius: 6px; padding: 10px;">
          <button type="button" class="btn2 primary auto-fetch-btn" style="padding: 10px 15px; background: var(--amber-500); color: var(--navy-950); border: none; font-weight: bold; border-radius: 6px; cursor: pointer; width: auto;">📥 Auto-Fetch</button>
        </div>
        <input type="file" class="vid-file" accept="video/mp4,video/x-m4v,video/*" style="display: none;">
        <div class="fetch-status" style="font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); margin-top: 5px;">Paste link and click Auto-Fetch</div>
        <input type="hidden" class="vid-direct-mp4"> 
      </div>
    </div>

    <!-- Hidden for now since API fetch handles one at a time efficiently -->
    <button type="button" id="addVideoRowBtn" class="btn2" style="border: 1px dashed var(--amber-500); color: var(--amber-400); margin-top: 10px; margin-bottom: 20px;">[+] Add Another Video</button>
    <button type="submit" id="vidSubmitBtn" class="btn2 primary">Upload & Submit to QA</button>
  </form>
</div>

<script src="supabase-config.js"></script>
<script>
(async function() {
    // IMPORTANT: Make sure to paste your NEW Apps Script Web App URL right here!
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw5DwIUNVxF1KNLlWQZo4HOPghlP7j_cNnVe7PqvraaC00K0R5VwzLvmKCcvE_DMN4kBA/exec";

    // Safely pull the employee record using your global function
    const emp = await getMyEmployeeRecord();
    
    if (!emp || !emp.id) {
        alert("Security Error: Could not verify your employee ID. Please log into the main dashboard first.");
        window.close();
        return;
    }

  // Add Multiple Rows Logic
    document.getElementById('addVideoRowBtn').addEventListener('click', () => {
        const container = document.getElementById('videoRowsContainer');
        const rowCount = container.querySelectorAll('.video-upload-row').length;
        
        if (rowCount >= 5) {
            alert('Maximum 5 videos per batch.');
            return;
        }

        const newRow = document.createElement('div');
        newRow.className = 'video-upload-row';
        newRow.style = 'background: var(--navy-800); padding: 15px; border-radius: 8px; border: 1px solid var(--line); position: relative; margin-top: 10px;';
        newRow.innerHTML = `
            <button type="button" class="remove-vid-row" style="position: absolute; top: -10px; right: -10px; background: var(--coral-500); color: white; border: none; border-radius: 50%; width: 22px; height: 22px; cursor: pointer; font-weight: bold; line-height: 1; z-index: 10;">&times;</button>
            <div style="display: flex; gap: 10px; margin-bottom: 8px; flex-wrap: wrap;">
              <input type="date" class="vid-date" required style="flex: 1; min-width: 110px; background: var(--navy-900); border: 1px solid var(--line); color: var(--paper); border-radius: 6px; padding: 10px;">
              <input type="url" class="vid-link" placeholder="TikTok Link (https://...)" required style="flex: 2; min-width: 180px; background: var(--navy-900); border: 1px solid var(--line); color: var(--paper); border-radius: 6px; padding: 10px;">
              <button type="button" class="btn2 primary auto-fetch-btn" style="padding: 10px 15px; background: var(--amber-500); color: var(--navy-950); border: none; font-weight: bold; border-radius: 6px; cursor: pointer; width: auto;">📥 Auto-Fetch</button>
            </div>
            <input type="file" class="vid-file" accept="video/mp4,video/x-m4v,video/*" style="display: none;">
            <div class="fetch-status" style="font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); margin-top: 5px;">Paste link and click Auto-Fetch</div>
            <input type="hidden" class="vid-direct-mp4">
        `;
        
        newRow.querySelector('.remove-vid-row').addEventListener('click', () => newRow.remove());
        container.appendChild(newRow);
    });

    // 1. Handle the Auto-Fetch Button Click
    document.addEventListener('click', async (e) => {
        if (e.target.classList.contains('auto-fetch-btn')) {
            const row = e.target.closest('.video-upload-row');
            const linkInput = row.querySelector('.vid-link').value;
            const statusText = row.querySelector('.fetch-status');
            const hiddenMp4 = row.querySelector('.vid-direct-mp4');
            
            if (!linkInput.includes('tiktok.com')) {
                alert("Please paste a valid TikTok URL.");
                return;
            }

            e.target.textContent = "⏳ Extracting...";
            e.target.disabled = true;
            statusText.textContent = "Contacting servers...";
            statusText.style.color = "var(--amber-400)";

            try {
                const response = await fetch(`https://tiktok-video-no-watermark2.p.rapidapi.com/?url=${encodeURIComponent(linkInput)}`, {
                    method: 'GET',
                    headers: {
                        'x-rapidapi-key': 'af4bdcd5ccmshd6c4e40e3ea867fp1b1477jsn5fa2407650bb',
                        'x-rapidapi-host': 'tiktok-video-no-watermark2.p.rapidapi.com'
                    }
                });
                
                const data = await response.json();
                
                if (!data.data || !data.data.play) throw new Error("Could not extract video. Ensure the video is public.");

                hiddenMp4.value = data.data.play; 
                
                e.target.textContent = "✅ Ready";
                e.target.style.background = "var(--mint-500)";
                statusText.textContent = "Video extracted successfully!";
                statusText.style.color = "var(--mint-500)";

            } catch (err) {
                e.target.textContent = "📥 Auto-Fetch";
                e.target.disabled = false;
                statusText.textContent = "Extraction failed: " + err.message;
                statusText.style.color = "var(--coral-500)";
            }
        }
    });

    // 2. Submit Button Logic
    document.getElementById('dedicatedVideoForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const rows = document.querySelectorAll('.video-upload-row');
        const submitBtn = document.getElementById('vidSubmitBtn');
        submitBtn.disabled = true;
        let successCount = 0;

        try {
            for (let i = 0; i < rows.length; i++) {
                submitBtn.textContent = `Processing Video ${i + 1} of ${rows.length}...`;
                
                const row = rows[i];
                const rowDate = row.querySelector('.vid-date').value;
                const linkInput = row.querySelector('.vid-link').value;
                const directMp4Url = row.querySelector('.vid-direct-mp4').value;

                if (!rowDate || !linkInput) continue;
                if (!directMp4Url) throw new Error(`Row ${i + 1} requires you to click Auto-Fetch first.`);

                const fileName = `${emp.id}_${Date.now()}_${i}.mp4`;
                
                const payload = {
                    action: "fetch_url",
                    directMp4Url: directMp4Url,
                    fileName: fileName
                };

                const response = await fetch(GOOGLE_SCRIPT_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();
                if (result.status !== "success") throw new Error(result.message);

                const { error: dbErr } = await supabaseClient.from('video_submissions').insert({
                    employee_id: emp.id,
                    upload_date: rowDate,
                    video_link: linkInput,
                    video_file_url: result.url,
                    status: 'pending'
                });

                if (dbErr) throw dbErr;
                successCount++;
            }

            alert(`Success! ${successCount} videos sent to QA.`);
            window.location.reload(); 

        } catch (err) {
            alert(`Process failed: ${err.message}`);
        } finally {
            submitBtn.textContent = 'Upload & Submit to QA';
            submitBtn.disabled = false;
        }
    });
})();
</script>
</body>
</html>
