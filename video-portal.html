<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EWC Video Portal</title>
<link rel="icon" type="image/svg+xml" href="easyway_icon.svg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root {
    --navy-950: #000000; --navy-900: #000000; --navy-800: #121212;
    --line: #262626; --paper: #ffffff; --text-muted: #a8a8a8;
    --mint-500: #4caf84; --font-mono: ui-monospace, Menlo, Consolas, monospace; --amber-500: #e8a13a; --amber-400: #f2b854; --coral-500: #d9614f;
    --font-display: 'Rockwell', Georgia, serif; 
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px; background: var(--navy-950); color: var(--paper); font-family: var(--font-body); display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; }
  .portal-container { max-width: 600px; width: 100%; background: var(--navy-900); border: 1px solid var(--line); border-radius: 16px; padding: 30px; margin-top: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
  .header { text-align: center; border-bottom: 1px solid var(--line); padding-bottom: 20px; margin-bottom: 20px; }
  .header h1 { margin: 0; font-family: var(--font-display); font-size: 22px; color: var(--amber-400); }
  .header p { margin: 5px 0 0 0; font-size: 13px; color: var(--text-muted); }
  .video-upload-row { background: var(--navy-800); padding: 15px; border-radius: 8px; border: 1px solid var(--line); position: relative; margin-bottom: 10px; }
  .remove-vid-row { position: absolute; top: -10px; right: -10px; background: var(--coral-500); color: white; border: none; border-radius: 50%; width: 22px; height: 22px; cursor: pointer; font-weight: bold; line-height: 1; z-index: 10; }
  .input-group { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  input { background: var(--navy-900); border: 1px solid var(--line); color: var(--paper); border-radius: 6px; padding: 10px; font-size: 13px; width: 100%; }
  input[type="date"] { flex: 1; min-width: 120px; }
  input[type="url"] { flex: 2; min-width: 200px; }
  input[type="file"] { border: 1px dashed var(--line); padding: 12px; cursor: pointer; }
  .btn2 { border-radius: 8px; padding: 12px 14px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid var(--line); background: transparent; color: var(--paper); text-align: center; width: 100%; display: block; transition: 0.2s; }
  .btn2.primary { background: var(--amber-500); color: var(--navy-950); border: none; font-weight: bold; }
  .btn2:disabled { opacity: 0.5; cursor: not-allowed; }
  .slot-badge { display: inline-block; font-family: var(--font-mono); font-weight: 700; font-size: 12px; color: var(--navy-950); background: var(--amber-400); padding: 3px 10px; border-radius: 4px; margin-bottom: 10px; letter-spacing: 0.5px; }
  .slot-badge.full { background: var(--coral-500); color: #fff; }
</style>
</head>
<body>

<div class="portal-container">
  <div class="header">
    <div style="display:flex; justify-content:center; margin-bottom:10px;"><img src="easyway_icon.svg" style="width:40px; height:40px;"></div>
    <h1>Dedicated Video Portal</h1>
    <p>Upload video files directly to Google Drive (Max 30MB per video).</p>
  </div>

<div id="slotStatus" style="text-align:center; font-size:12px; font-family: var(--font-mono); color: var(--text-muted); margin: -8px 0 16px 0;">Checking video slots...</div>

<div style="display:flex; gap:10px; align-items:center; justify-content:center; margin: 0 0 16px 0; flex-wrap:wrap;">
    <label for="cycleSelect" style="font-size:12px; color: var(--text-muted); font-family: var(--font-mono);">Upload to:</label>
    <select id="cycleSelect" style="background: var(--navy-800); color: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font-size: 13px; width:auto; max-width:100%;"></select>
  </div>

<!-- BACK BUTTON -->
  <button type="button" onclick="window.location.href='dashboard-employee.html'" style="background: transparent; border: none; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; gap: 5px; font-size: 13px; margin-bottom: 15px; padding: 0; font-family: var(--font-body); transition: color 0.2s;" onmouseover="this.style.color='var(--paper)'" onmouseout="this.style.color='var(--text-muted)'">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
    Return to Dashboard
  </button>
  
  <form id="dedicatedVideoForm">
    <div id="videoRowsContainer" style="display: flex; flex-direction: column; gap: 10px;">
      <div class="video-upload-row" style="background: var(--navy-800); padding: 15px; border-radius: 8px; border: 1px solid var(--line); position: relative;">
        <div class="slot-badge">V?</div>
        <div style="display: flex; gap: 10px; margin-bottom: 8px; flex-wrap: wrap;">
          <input type="date" class="vid-date" required style="flex: 1; min-width: 110px; background: var(--navy-900); border: 1px solid var(--line); color: var(--paper); border-radius: 6px; padding: 10px;">
          <input type="url" class="vid-link" placeholder="TikTok or Shopee Video link (https://...)" required style="flex: 2; min-width: 180px; background: var(--navy-900); border: 1px solid var(--line); color: var(--paper); border-radius: 6px; padding: 10px;">
          <button type="button" class="btn2 primary auto-fetch-btn" style="padding: 10px 15px; background: var(--amber-500); color: var(--navy-950); border: none; font-weight: bold; border-radius: 6px; cursor: pointer; width: auto;">📥 Auto-Fetch</button>
        </div>
        <input type="file" class="vid-file" accept="video/mp4,video/x-m4v,video/*" style="display: none;">
        <div class="fetch-status" style="font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); margin-top: 5px;">Paste link and click Auto-Fetch</div>
        <input type="hidden" class="vid-direct-mp4"> 
      </div>
    </div>

    <!-- Hidden for now since API fetch handles one at a time efficiently -->
    <button type="button" id="addVideoRowBtn" class="btn2" style="border: 1px dashed var(--amber-500); color: var(--amber-400); margin-top: 10px; margin-bottom: 20px;">[+] Add Another Video</button>
    <button type="submit" id="vidSubmitBtn" class="btn2 primary">Upload & Submit to QA</button>
  </form>
</div>

<script src="supabase-config.js"></script>
<script>
(async function() {
    // IMPORTANT: Make sure to paste your NEW Apps Script Web App URL right here!

    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyaYKxaB_Qpha-mZMB0U2PL5LXASs6agtQT7DLI-dsRa-PIxOYtZds4M9f4KuBtQ3Nqrg/exec";

    // Safely pull the employee record using your global function
    const emp = await getMyEmployeeRecord();
    
    if (!emp || !emp.id) {
        alert("Security Error: Could not verify your employee ID. Please log into the main dashboard first.");
        window.close();
        return;
    }

  // ---------- V1-V15 SLOT HELPERS (cycle = 28th -> 27th) ----------
    const SLOT_LIMIT = 15;
    let slotsFull = false;
    const pad2 = n => String(n).padStart(2, '0');
    const fmtD = dt => `${dt.getFullYear()}-${pad2(dt.getMonth() + 1)}-${pad2(dt.getDate())}`;

    function cycleStartOf(dateStr) {               // dateStr = YYYY-MM-DD
        const [y, m, d] = dateStr.split('-').map(Number);
        return fmtD(d >= 28 ? new Date(y, m - 1, 28) : new Date(y, m - 2, 28));
    }
    function cycleLabel(cycleStartStr) {
        const [y, m, d] = cycleStartStr.split('-').map(Number);
        const f = dt => dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        return `${f(new Date(y, m - 1, d))} - ${f(new Date(y, m, 27))}`;
    }
    function cycleEndOf(cs) {                      // cs = YYYY-MM-DD (the 28th)
        const [y, m] = cs.split('-').map(Number);
        return fmtD(new Date(y, m, 27));
    }
    function prevCycleStart(cs) {
        const [y, m] = cs.split('-').map(Number);
        return fmtD(new Date(y, m - 2, 28));
    }
    const CURRENT_CYCLE = cycleStartOf(fmtD(new Date()));
    const LAST_CYCLE = prevCycleStart(CURRENT_CYCLE);
    let selectedCycle = CURRENT_CYCLE;

    (function buildCycleOptions() {
        const sel = document.getElementById('cycleSelect');
        sel.innerHTML = `
            <option value="${CURRENT_CYCLE}">Current cycle (${cycleLabel(CURRENT_CYCLE)})</option>
            <option value="${LAST_CYCLE}">Last cycle (${cycleLabel(LAST_CYCLE)})</option>`;
        sel.addEventListener('change', () => {
            selectedCycle = sel.value;
            applyDateLimits(true);
            refreshSlotStatus();
        });
    })();

    // Only dates inside the selected cycle can be picked (also stops wrong-year typos)
    function applyDateLimits(clearOutOfRange) {
        const min = selectedCycle;
        const end = cycleEndOf(selectedCycle);
        const today = fmtD(new Date());
        const max = end < today ? end : today;
        document.querySelectorAll('.vid-date').forEach(inp => {
            inp.min = min; inp.max = max;
            if (clearOutOfRange && inp.value && (inp.value < min || inp.value > max)) inp.value = '';
        });
    }

    async function getUsedSlots(cycleStart) {
        const { data, error } = await supabaseClient
            .from('video_submissions').select('video_no')
            .eq('employee_id', emp.id).eq('cycle_start', cycleStart);
        if (error) throw error;
        return new Set((data || []).map(r => r.video_no));
    }
    async function refreshSlotStatus() {
        const el = document.getElementById('slotStatus');
        const cs = selectedCycle;
        const tag = cs === CURRENT_CYCLE ? '' : ' (last cycle)';
        applyDateLimits(false);
        try {
            const used = await getUsedSlots(cs);
            const free = [];
            for (let n = 1; n <= SLOT_LIMIT; n++) { if (!used.has(n)) free.push(n); }
            slotsFull = free.length === 0;
            el.style.color = slotsFull ? 'var(--coral-500)' : 'var(--text-muted)';
            el.textContent = slotsFull
                ? `Cycle ${cycleLabel(cs)}${tag}: ${SLOT_LIMIT}/${SLOT_LIMIT} slots used. FULL. Delete an old or wrong video in the dashboard to free a slot.`
                : `Cycle ${cycleLabel(cs)}${tag}: ${used.size}/${SLOT_LIMIT} slots used. ` +
                  (free.length <= 6 ? `Free: ${free.map(n => 'V' + n).join(', ')}.` : `Next upload will be V${free[0]}.`);
            document.getElementById('vidSubmitBtn').disabled = slotsFull;
            document.getElementById('addVideoRowBtn').disabled = slotsFull;
        } catch (err) {
            el.style.color = 'var(--coral-500)';
            el.textContent = 'Could not check video slots: ' + (err.message || err);
            console.error('Slot status error:', err);
        }
        updateRowSlotLabels();
    }

    // Shows which slot (V#) each row will take in the SELECTED cycle (lowest free first)
    let labelRun = 0;
    async function updateRowSlotLabels() {
        const run = ++labelRun;
        const rows = [...document.querySelectorAll('.video-upload-row')];
        let used = null;
        try { used = await getUsedSlots(selectedCycle); } catch (_) {}
        if (run !== labelRun) return;   // a newer update started; drop this one
        for (const row of rows) {
            const badge = row.querySelector('.slot-badge');
            if (!badge) continue;
            if (!used) { badge.textContent = 'V?'; continue; }
            let slot = null;
            for (let n = 1; n <= SLOT_LIMIT; n++) { if (!used.has(n)) { slot = n; break; } }
            if (slot === null) {
                badge.textContent = 'FULL';
                badge.classList.add('full');
            } else {
                used.add(slot);
                badge.textContent = 'V' + slot;
                badge.classList.remove('full');
            }
        }
    }
    document.addEventListener('change', (e) => {
        if (e.target.classList && e.target.classList.contains('vid-date')) updateRowSlotLabels();
    });
    applyDateLimits(false);
    refreshSlotStatus();

  // Add Multiple Rows Logic
    document.getElementById('addVideoRowBtn').addEventListener('click', async () => {
        const container = document.getElementById('videoRowsContainer');
        const rowCount = container.querySelectorAll('.video-upload-row').length;
        
        if (slotsFull) { alert('All 15 video slots for this cycle are used. Delete an old or wrong video first.'); return; }
        if (rowCount >= 5) {
            alert('Maximum 5 videos per batch.');
            return;
        }

        const newRow = document.createElement('div');
        newRow.className = 'video-upload-row';
        newRow.style = 'background: var(--navy-800); padding: 15px; border-radius: 8px; border: 1px solid var(--line); position: relative; margin-top: 10px;';
        newRow.innerHTML = `
            <button type="button" class="remove-vid-row" style="position: absolute; top: -10px; right: -10px; background: var(--coral-500); color: white; border: none; border-radius: 50%; width: 22px; height: 22px; cursor: pointer; font-weight: bold; line-height: 1; z-index: 10;">&times;</button>
            <div class="slot-badge">V?</div>
            <div style="display: flex; gap: 10px; margin-bottom: 8px; flex-wrap: wrap;">
              <input type="date" class="vid-date" required style="flex: 1; min-width: 110px; background: var(--navy-900); border: 1px solid var(--line); color: var(--paper); border-radius: 6px; padding: 10px;">
              <input type="url" class="vid-link" placeholder="TikTok or Shopee Video link (https://...)" required style="flex: 2; min-width: 180px; background: var(--navy-900); border: 1px solid var(--line); color: var(--paper); border-radius: 6px; padding: 10px;">
              <button type="button" class="btn2 primary auto-fetch-btn" style="padding: 10px 15px; background: var(--amber-500); color: var(--navy-950); border: none; font-weight: bold; border-radius: 6px; cursor: pointer; width: auto;">📥 Auto-Fetch</button>
            </div>
            <input type="file" class="vid-file" accept="video/mp4,video/x-m4v,video/*" style="display: none;">
            <div class="fetch-status" style="font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); margin-top: 5px;">Paste link and click Auto-Fetch</div>
            <input type="hidden" class="vid-direct-mp4">
        `;
        
        newRow.querySelector('.remove-vid-row').addEventListener('click', () => { newRow.remove(); updateRowSlotLabels(); });
        container.appendChild(newRow);
        applyDateLimits(false);
        await updateRowSlotLabels();
        if (newRow.querySelector('.slot-badge').classList.contains('full')) {
            newRow.remove();
            updateRowSlotLabels();
            alert('No more free slots in this cycle. Delete an old or wrong video in the dashboard first.');
        }
    });

    // If the link is edited after fetching, the fetched video no longer matches: reset it
    document.addEventListener('input', (e) => {
        if (!e.target.classList.contains('vid-link')) return;
        const row = e.target.closest('.video-upload-row');
        if (!row.querySelector('.vid-direct-mp4').value) return;
        row.querySelector('.vid-direct-mp4').value = '';
        const btn = row.querySelector('.auto-fetch-btn');
        btn.textContent = '📥 Auto-Fetch'; btn.disabled = false; btn.style.background = 'var(--amber-500)';
        const st = row.querySelector('.fetch-status');
        st.textContent = 'Link changed. Click Auto-Fetch again.'; st.style.color = 'var(--amber-400)';
    });

    // Which platform is this link from?
    function detectPlatform(link) {
        let host = '';
        try { host = new URL(link).hostname.toLowerCase(); } catch (_) { host = String(link).toLowerCase(); }
        if (host.includes('tiktok.com')) return 'tiktok';
        if (/(^|\.)shopee\.|(^|\.)shp\.ee$|(^|\.)shope\.ee$/.test(host)) return 'shopee';
        return null;
    }

    // Finds the video file URL inside whatever JSON the Shopee API returns
    function pickVideoUrl(data, inputLink) {
        const urls = [];
        (function walk(node, key) {
            if (typeof node === 'string') { if (/^https?:\/\//i.test(node)) urls.push({ u: node, k: key || '' }); return; }
            if (Array.isArray(node)) { node.forEach(n => walk(n, key)); return; }
            if (node && typeof node === 'object') Object.entries(node).forEach(([k, v]) => walk(v, k));
        })(data, '');
        const isImg = u => /\.(jpe?g|png|gif|webp|avif|svg)(\?|$)/i.test(u);
        const cand = urls.filter(x => x.u !== inputLink && !isImg(x.u) && !/cover|thumb|image|avatar|poster|logo/i.test(x.k));
        const best = cand.find(x => /\.mp4(\?|$)/i.test(x.u))
                  || cand.find(x => /video|mp4|download|play|src|url|link/i.test(x.k))
                  || cand[0];
        return best ? best.u : null;
    }

    // 1. Handle the Auto-Fetch Button Click (TikTok or Shopee)
    document.addEventListener('click', async (e) => {
        if (e.target.classList.contains('auto-fetch-btn')) {
            const row = e.target.closest('.video-upload-row');
            const linkInput = row.querySelector('.vid-link').value.trim();
            const statusText = row.querySelector('.fetch-status');
            const hiddenMp4 = row.querySelector('.vid-direct-mp4');

            const platform = detectPlatform(linkInput);
            if (!platform) {
                alert("Please paste a valid TikTok or Shopee Video link.");
                return;
            }

            e.target.textContent = "⏳ Extracting...";
            e.target.disabled = true;
            statusText.textContent = "Contacting servers...";
            statusText.style.color = "var(--amber-400)";

            try {
                // Both platforms go through our own Supabase Edge Functions
                // (keeps the API keys off the public page)
                const fnName = platform === 'shopee' ? 'shopee-fetch' : 'tiktok-fetch';
                const { data: fnData, error: fnErr } = await supabaseClient.functions.invoke(fnName, {
                    body: { url: linkInput }
                });
                console.log(`${platform} Auto-Fetch response:`, fnData, fnErr);
                if (fnErr) throw new Error('Could not reach the auto-fetch service. Try again, and tell your admin if it keeps happening.');
                if (!fnData || fnData.error || !fnData.videoUrl) {
                    throw new Error((fnData && fnData.error) || (platform === 'shopee'
                        ? 'Could not find a video in that Shopee link. Make sure it is a public Shopee Video link.'
                        : 'Could not extract video. Ensure the video is public.'));
                }
                const videoUrl = fnData.videoUrl;

                hiddenMp4.value = videoUrl;

                e.target.textContent = "✅ Ready";
                e.target.style.background = "var(--mint-500)";
                statusText.textContent = "Video extracted successfully!";
                statusText.style.color = "var(--mint-500)";

            } catch (err) {
                e.target.textContent = "📥 Auto-Fetch";
                e.target.disabled = false;
                statusText.textContent = "Extraction failed: " + err.message;
                statusText.style.color = "var(--coral-500)";
            }
        }
    });

    // 2. Submit Button Logic
    document.getElementById('dedicatedVideoForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const rows = [...document.querySelectorAll('.video-upload-row')];
        const submitBtn = document.getElementById('vidSubmitBtn');
        submitBtn.disabled = true;
        const assigned = [];

        try {
            // ---- PRE-CHECK (nothing is uploaded until every row passes) ----
            const usedByCycle = {};
            const plan = [];
            for (let i = 0; i < rows.length; i++) {
                const row = rows[i];
                const rowDate = row.querySelector('.vid-date').value;
                const linkInput = row.querySelector('.vid-link').value;
                const directMp4Url = row.querySelector('.vid-direct-mp4').value;
                if (!rowDate || !linkInput) continue;
                if (!directMp4Url) throw new Error(`Row ${i + 1} requires you to click Auto-Fetch first.`);

                const cs = cycleStartOf(rowDate);
                if (cs !== selectedCycle) {
                    throw new Error(`Row ${i + 1}: the date must be inside the selected cycle (${cycleLabel(selectedCycle)}). Change the date or the "Upload to" cycle.`);
                }
                if (!usedByCycle[cs]) usedByCycle[cs] = await getUsedSlots(cs);
                let slot = null;
                for (let n = 1; n <= SLOT_LIMIT; n++) { if (!usedByCycle[cs].has(n)) { slot = n; break; } }
                if (slot === null) {
                    throw new Error(`Cycle ${cycleLabel(cs)} is full (${SLOT_LIMIT}/${SLOT_LIMIT}). Delete an old or wrong video in the dashboard to free a slot.`);
                }
                usedByCycle[cs].add(slot);
                plan.push({ row, rowDate, linkInput, directMp4Url, slot });
            }
            if (plan.length === 0) throw new Error('Nothing to submit.');

            // ---- UPLOAD ONE BY ONE ----
            for (let k = 0; k < plan.length; k++) {
                const { row, rowDate, linkInput, directMp4Url, slot } = plan[k];
                submitBtn.textContent = `Processing Video ${k + 1} of ${plan.length}...`;

                const [year, month, day] = rowDate.split('-');
                const formattedDate = `${month}-${day}-${year}`;
                // First name only, letters/numbers only (accents and symbols would break Storage file keys)
                const firstName = (String(emp.name || '').trim().split(/\s+/)[0] || 'EMP')
                    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                    .replace(/[^A-Za-z0-9]/g, '').toUpperCase() || 'EMP';

                // File name: V#_MM-DD-YYYY_NAME.mp4  (same name in Storage and Google Drive)
                const fileName = `V${slot}_${formattedDate}_${firstName}.mp4`;
                let storagePath = `public/${fileName}`;

                let vidResponse;
                try {
                    vidResponse = await fetch(directMp4Url);
                } catch (netErr) {
                    console.error('Video download blocked or failed:', netErr, directMp4Url);
                    throw new Error(`The browser could not download the video for V${slot} (the video host blocked it or the link expired). Click Auto-Fetch again, and tell your admin if it keeps happening.`);
                }
                if (!vidResponse.ok) throw new Error(`Could not download the video for V${slot} (HTTP ${vidResponse.status}). Click Auto-Fetch again.`);
                const vidBlob = await vidResponse.blob();

                // 1. UPLOAD TO SUPABASE (for the AI)
                let { error: uploadErr } = await supabaseClient.storage
                    .from('temp-ai-videos')
                    .upload(storagePath, vidBlob, { upsert: false });

                // Same name already in storage (e.g. another employee with the same first name,
                // or a leftover file): add a short id suffix instead of overwriting it
                if (uploadErr && /already exists|duplicate|409/i.test(String(uploadErr.message || uploadErr.statusCode || uploadErr.error))) {
                    storagePath = `public/${fileName.replace(/\.mp4$/, '')}_${String(emp.id).slice(0, 4)}.mp4`;
                    ({ error: uploadErr } = await supabaseClient.storage
                        .from('temp-ai-videos')
                        .upload(storagePath, vidBlob, { upsert: false }));
                }
                if (uploadErr) throw uploadErr;

                const { data: publicUrlData } = supabaseClient.storage
                    .from('temp-ai-videos')
                    .getPublicUrl(storagePath);
                const supabaseVideoUrl = publicUrlData.publicUrl;

                // 2. SYNC TO GOOGLE DRIVE
                submitBtn.textContent = `Syncing Video ${k + 1} to Drive...`;
                let finalGDriveUrl = null;
                try {
                    const gDriveResponse = await fetch(GOOGLE_SCRIPT_URL, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify({
                            action: "fetch_url",
                            directMp4Url: supabaseVideoUrl,
                            fileName: fileName,
                            employeeName: emp.name
                        })
                    });
                    const driveResult = await gDriveResponse.json();
                    finalGDriveUrl = driveResult.status === "success" ? driveResult.url : null;
                } catch (driveErr) {
                    console.warn('Drive sync failed:', driveErr);
                }

                // 3. SAVE TO DB (the database assigns the final V# and enforces the 15 limit)
                const { data: saved, error: dbErr } = await supabaseClient
                    .from('video_submissions')
                    .insert({
                        employee_id: emp.id,
                        upload_date: rowDate,
                        video_link: linkInput,
                        video_file_url: supabaseVideoUrl,
                        gdrive_url: finalGDriveUrl,
                        status: 'pending'
                    })
                    .select('video_no')
                    .single();

                if (dbErr) {
                    // Don't leave an orphan file behind if the row was rejected
                    await supabaseClient.storage.from('temp-ai-videos').remove([storagePath]);
                    if (String(dbErr.message).includes('VIDEO_SLOTS_FULL')) {
                        throw new Error('All 15 video slots for this cycle are used. Delete an old or wrong video first.');
                    }
                    throw dbErr;
                }

                assigned.push(`V${saved?.video_no ?? slot}`);
                row.remove();   // already submitted: never send it twice if a later row fails
            }

            alert(`Success! ${assigned.join(', ')} sent to QA.`);
            window.location.reload();

        } catch (err) {
            const done = assigned.length ? `\n\nAlready submitted: ${assigned.join(', ')}.` : '';
            alert(`Process failed: ${err.message}${done}`);
            refreshSlotStatus();
        } finally {
            submitBtn.textContent = 'Upload & Submit to QA';
            if (!slotsFull) submitBtn.disabled = false;
        }
    });
})();
</script>
</body>
</html>
