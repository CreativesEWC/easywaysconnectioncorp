<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EWC Corp. — Sign In</title>
<link rel="icon" type="image/svg+xml" href="easyway_icon.svg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root {
    --bg-page: #f8fafc;
    --card-bg: #ffffff;
    --text-primary: #0f172a;
    --text-muted: #64748b;
    --border-line: #e2e8f0;
    --input-bg: #ffffff;
    --input-border: #cbd5e1;
    --amber-500: #d97706;
    --amber-600: #b45309;
    --coral-bg: #fef2f2;
    --coral-border: #fecaca;
    --coral-text: #dc2626;
    --font-display: 'Rockwell', Georgia, serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --font-mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg-page);
    color: var(--text-primary);
    font-family: var(--font-body);
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 390px;
    background: var(--card-bg);
    border: 1px solid var(--border-line);
    border-radius: 18px;
    padding: 36px 32px;
    box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
  }
  .brand-header {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 24px;
  }
  .brand-logo {
    width: 48px;
    height: 48px;
    margin-bottom: 12px;
  }
  .eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--amber-500);
    margin: 0 0 6px;
    text-align: center;
    font-weight: 600;
  }
  h1 {
    font-family: var(--font-display);
    font-size: 26px;
    margin: 0;
    text-align: center;
    color: var(--text-primary);
  }
  label {
    display: block;
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 6px;
    font-family: var(--font-mono);
    font-weight: 500;
  }
  input {
    width: 100%;
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    color: var(--text-primary);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 15px;
    margin-bottom: 18px;
    font-family: var(--font-body);
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  input:focus {
    outline: none;
    border-color: var(--amber-500);
    box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.15);
  }
  button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: var(--amber-500);
    color: #ffffff;
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
    transition: background 0.2s;
  }
  button:hover {
    background: var(--amber-600);
  }
  button:disabled {
    opacity: .6;
    cursor: default;
  }
  .error {
    background: var(--coral-bg);
    border: 1px solid var(--coral-border);
    color: var(--coral-text);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13px;
    margin-bottom: 18px;
    display: none;
    line-height: 1.4;
  }
  .error.show { display: block; }
  footer {
    text-align: center;
    margin-top: 24px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-muted);
  }
</style>
</head>
<body>

  <div class="card">
    <div class="brand-header">
      <img src="easyway_icon.svg" alt="EWC Logo" class="brand-logo">
      <p class="eyebrow">Easy Ways Connection Corp.</p>
      <h1>Sign In</h1>
    </div>

    <div class="error" id="errorBox"></div>

    <form id="loginForm">
      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="username" placeholder="name@ewc.com" required>

      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" placeholder="••••••••" required>

      <button type="submit" id="submitBtn">Sign In</button>
    </form>

    <footer>Internal portal access only</footer>
  </div>

<script src="supabase-config.js"></script>
<script>
  const form = document.getElementById('loginForm');
  const errorBox = document.getElementById('errorBox');
  const submitBtn = document.getElementById('submitBtn');

  function showError(msg){
    errorBox.textContent = msg;
    errorBox.classList.add('show');
  }

  (async () => {
    const emp = await getMyEmployeeRecord();
    if (emp) routeToRoleHome(emp);
  })();

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.classList.remove('show');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Signing in…';

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

    if (error) {
      showError('Incorrect email or password. Please try again.');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Sign In';
      return;
    }

    const emp = await getMyEmployeeRecord();
    if (!emp) {
      showError('Login succeeded, but no linked employee record was found. Please contact an administrator.');
      await supabaseClient.auth.signOut();
      submitBtn.disabled = false;
      submitBtn.textContent = 'Sign In';
      return;
    }

    routeToRoleHome(emp);
  });
</script>

</body>
</html>
