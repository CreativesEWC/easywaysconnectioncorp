<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Video Matrix QA | EWC Dev</title>
<link rel="icon" type="image/svg+xml" href="easyway_icon.svg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root {
    --navy-950: #050812;
    --navy-900: #0a0f25;
    --navy-800: #121b3a;
    --navy-700: #1a2752;
    --line: #2a3b5c;       
    --paper: #ffffff;      
    --text-muted: #7488b6; 
    --amber-500: #e8a13a; --amber-400: #f2b854; 
    --mint-500: #4fb286; --mint-700: #2f7a58; 
    --coral-500: #d9614f; --coral-700: #a63e2f;
    --font-display: 'Rockwell', Georgia, serif; 
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --font-mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 0; background: var(--navy-950); color: var(--paper); font-family: var(--font-body); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  
  header { background: var(--navy-900); padding: 15px 24px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
  .header-brand { font-family: var(--font-display); font-size: 20px; color: var(--mint-500); display: flex; align-items: center; gap: 10px; }
  .btn { background: var(--navy-800); border: 1px solid var(--line); color: var(--paper); padding: 8px 16px; border-radius: 6px; font-size: 12px; cursor: pointer; }
  .btn:hover { border-color: var(--amber-500); }
  .btn.primary { background: var(--mint-500); color: var(--navy-950); border: none; font-weight: bold; }

  /* 3-Column Workspace Layout */
  .workspace { display: flex; flex: 1; overflow: hidden; }
  
  /* Col 1: Inbox */
  .col-inbox { width: 320px; background: var(--navy-900); border-right: 1px solid var(--line); display: flex; flex-direction: column; flex-shrink: 0; }
  .inbox-header { padding: 15px; border-bottom: 1px solid var(--line); font-family: var(--font-mono); font-size: 12px; color: var(--amber-400); text-transform: uppercase; letter-spacing: 0.1em; display: flex; justify-content: space-between; }
  .inbox-list { flex: 1; overflow-y: auto; }
  .inbox-search { padding: 10px 15px; border-bottom: 1px solid var(--line); position: relative; flex-shrink: 0; }
  .inbox-search input { width: 100%; background: var(--navy-800); border: 1px solid var(--line); color: var(--paper); padding: 9px 30px 9px 12px; border-radius: 6px; font-size: 13px; font-family: var(--font-body); outline: none; }
  .inbox-search input::placeholder { color: var(--text-muted); }
  .inbox-search input:focus { border-color: var(--amber-500); }
  .inbox-search .search-clear { position: absolute; right: 24px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); font-size: 18px; line-height: 1; cursor: pointer; display: none; padding: 0; }
  .inbox-search .search-clear:hover { color: var(--paper); }
  .no-match { padding: 30px; text-align: center; color: var(--text-muted); font-size: 13px; display: none; }
  .vid-item { padding: 15px; border-bottom: 1px solid var(--line); cursor: pointer; transition: 0.2s; display: flex; gap: 12px; align-items: center; }
  .vid-item:hover { background: var(--navy-800); }
  .vid-item.active { background: var(--navy-800); border-left: 4px solid var(--mint-500); }
  .vid-thumb { width: 48px; height: 48px; border-radius: 6px; background: #000; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 20px; border: 1px solid var(--line); }
  .vid-info { flex: 1; min-width: 0; }
  .vid-name { font-weight: bold; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vid-meta { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); margin-top: 4px; }

  /* Col 2: Video Player */
  .col-player { flex: 1; background: #000; display: flex; align-items: center; justify-content: center; position: relative; }
  video { max-width: 100%; max-height: 100%; outline: none; }
  .no-video-overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-muted); font-family: var(--font-mono); }

  /* Col 3: QA Matrix */
  .col-qa { width: 400px; background: var(--navy-900); border-left: 1px solid var(--line); display: flex; flex-direction: column; flex-shrink: 0; }
  .qa-scroll { flex: 1; overflow-y: auto; padding: 20px; }
  .rule-card { display: flex; align-items: flex-start; gap: 10px; background: var(--navy-800); padding: 12px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; cursor: pointer; transition: 0.2s; }
  .rule-card:hover { border-color: var(--amber-500); }
  .rule-cb { margin-top: 2px; width: 16px; height: 16px; accent-color: var(--mint-500); cursor: pointer; }
  .rule-text { font-size: 13px; color: var(--paper); line-height: 1.3; cursor: pointer; }
  
  .qa-footer { padding: 20px; background: var(--navy-950); border-top: 1px solid var(--line); }
  .score-display { font-family: var(--font-display); font-size: 32px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
  .score-status { font-family: var(--font-mono); font-size: 14px; text-transform: uppercase; }
</style>
</head>
<body>

<header>
  <div class="header-brand">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 0 1 7 7v5h-2v-5a5 5 0 0 0-5-5h-1v1.27a2 2 0 1 1-2 0V7H8a5 5 0 0 0-5 5v5H1v-5a7 7 0 0 1 7-7h1V5.73A2 2 0 0 1 12 2z"/></svg>
    AI Video Matrix QA
  </div>
  <button class="btn" onclick="window.location.href='dashboard-admin.html'">Return to Admin Dashboard</button>
</header>

<div class="workspace">
  <!-- INBOX -->
  <div class="col-inbox">
    <div class="inbox-header">
      Pending Audits <span id="pendingCount">0</span>
    </div>
    <div class="inbox-search">
      <input type="text" id="inboxSearch" placeholder="Search by name..." autocomplete="off" oninput="filterQueue()">
      <button class="search-clear" id="searchClear" title="Clear search" onclick="clearSearch()">&times;</button>
    </div>
    <div class="inbox-list" id="videoInbox">
      <div style="padding: 20px; text-align: center; color: var(--text-muted); font-style: italic;">Loading queue...</div>
    </div>
  </div>

  <!-- PLAYER -->
  <div class="col-player">
    <div id="noVideoMsg" class="no-video-overlay">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" style="margin-bottom: 10px; opacity: 0.5;"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect><line x1="7" y1="2" x2="7" y2="22"></line><line x1="17" y1="2" x2="17" y2="22"></line><line x1="2" y1="12" x2="22" y2="12"></line><line x1="2" y1="7" x2="7" y2="7"></line><line x1="2" y1="17" x2="7" y2="17"></line><line x1="17" y1="17" x2="22" y2="17"></line><line x1="17" y1="7" x2="22" y2="7"></line></svg>
      Select a video from the queue
    </div>
    <iframe id="mainPlayer" allow="autoplay; fullscreen" style="width: 100%; height: 100%; border: none; display: none; background: #000;"></iframe>
  </div>

  <!-- SCORECARD -->
  <div class="col-qa">
    <div style="padding: 15px; border-bottom: 1px solid var(--line); font-family: var(--font-mono); font-size: 12px; color: var(--amber-400); text-transform: uppercase; letter-spacing: 0.1em; display: flex; justify-content: space-between; align-items: center;">
      <span>Evaluation Matrix</span>
      <button class="btn" onclick="resetForm()" style="padding: 4px 8px; font-size: 10px;">Clear</button>
    </div>
    
   <!-- AI Grading Mode & Brand Context Selector -->
    <div style="padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--navy-950); display: flex; flex-wrap: wrap; gap: 30px; align-items: center;">
      <div>
        <div style="font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px;">AI Grading Mode</div>
        <div style="display: flex; gap: 15px; font-size: 13px;">
          <label style="cursor: pointer; display: flex; align-items: center; gap: 4px;"><input type="radio" name="aiMode" value="strict"> Strict</label>
          <label style="cursor: pointer; display: flex; align-items: center; gap: 4px;"><input type="radio" name="aiMode" value="creative" checked> Creative</label>
          <label style="cursor: pointer; display: flex; align-items: center; gap: 4px;"><input type="radio" name="aiMode" value="combined"> Combined</label>
        </div>
      </div>
      
      <div>
        <div style="font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px;">Target Brand / Focus</div>
        <select id="brandContext" style="background: var(--navy-900); color: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; font-size: 12px; font-family: var(--font-body); outline: none;">
            <option value="general">Generic E-Commerce</option>
            <option value="seoul">Seoul Secrets (Skincare/Inclusive)</option>
            <option value="momom">Momom Foods (Sweets/Snacks)</option>
            <option value="wowlinis">WowLinis (Home Cleaning)</option>
            <option value="puti">Puti Plus (Laundry)</option>
            <option value="coffee">ME & Joco Coffee</option>
        </select>
      </div>
    </div>
    
    <div class="qa-scroll">
      <div id="qaChecklist"></div>
      
      <div style="margin-top: 20px;">
        <div style="display: flex; justify-content: space-between; align-items: flex-end;">
            <label style="font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); text-transform: uppercase;">AI / Admin Feedback</label>
            <button class="btn" id="generateFeedbackBtn" style="padding: 4px 8px; font-size: 10px; background: var(--navy-800); color: var(--mint-500); border-color: var(--mint-500);">🤖 Auto-Write Feedback</button>
        </div>
        <textarea id="qaNotes" placeholder="Explain flagged rules for the seller's future reference..." style="width: 100%; height: 100px; margin-top: 8px; background: var(--navy-800); border: 1px solid var(--line); color: var(--paper); border-radius: 6px; padding: 10px; font-family: var(--font-body); font-size: 13px; resize: vertical;"></textarea>
      </div>
    
    <div class="qa-footer">
      <div class="score-display">
        <div><span id="liveScore">0</span><span style="font-size: 16px; color: var(--text-muted);">/10</span></div>
        <div id="liveStatus" class="score-status" style="color: var(--coral-500);">Unusable</div>
      </div>
      <div style="display: flex; gap: 10px; width: 100%;">
        <button class="btn" id="manualCheckBtn" style="flex: 1; padding: 14px; background: var(--navy-800); border-color: var(--line);" disabled>Manual Check</button>
        <button class="btn primary" id="autoCheckBtn" style="flex: 1; padding: 14px;" disabled>Auto AI Check</button>
      </div>
    </div>

<script src="supabase-config.js"></script>
<script>
  let activeVideoId = null;
  let activeEmployeeId = null;
  let activeUploadDate = null;
  let activeRawVideoUrl = null;

  const ruleSets = {
      strict: [
          "1. Exact Brand Messaging: Accurate feature description without deviation.",
          "2. Professional Setup: Flawless studio or highly controlled lighting.",
          "3. Perfect Audio: Zero background noise or echo.",
          "4. Spotless Background: Clinical, clean, or highly professional setting.",
          "5. Zero Filler Words: No stutters, slang, or 'ums/ahs'.",
          "6. Prominent Logo/Product: Product perfectly centered and legible.",
          "7. Formal Delivery: Professional and authoritative tone.",
          "8. Direct Call-to-Action: Explicit instruction to buy or click.",
          "9. Technical Quality: High resolution and perfect framing.",
          "10. Brand Safety: Completely risk-free and family-friendly."
      ],
      creative: [
          "1. The Hook: High-energy or visually striking first 3 seconds.",
          "2. Authentic Vibe: Natural, relatable, and human delivery.",
          "3. Trend Alignment: Fits perfectly into current TikTok styles.",
          "4. Organic Integration: Product feels naturally placed, not forced.",
          "5. Creative Concept: Uses skits, magic, stacking, or humor.",
          "6. Dynamic Pacing: Fast cuts or engaging physical movement.",
          "7. Visual Payoff: Satisfying conclusion (e.g., eating, applying).",
          "8. High Retention: Highly engaging enough to watch twice.",
          "9. Casual Setup: Forgives messy/casual rooms if vibe fits.",
          "10. Conversational Audio: Slang and casual talk are allowed."
      ],
      combined: [
          "1. Clear Product Value: Viewers understand why it is useful.",
          "2. Product Integration: Product is shown or handled.",
          "3. Presentable Setup: Looks appealing but doesn't need to be perfect.",
          "4. Acceptable Background: Natural, neat, or creative.",
          "5. Product Spotlight: Viewer can clearly see what is sold.",
          "6. The Hook: Grabs attention early.",
          "7. Authentic Energy: Natural and engaging without sounding robotic.",
          "8. Visual Payoff: Shows product in action.",
          "9. Viral Potential: Interesting enough for real people to watch.",
          "10. Basic Quality: Audio understandable, video clear."
      ]
  };

  let activeRules = ruleSets.creative; // Default selection

  // 1. Initialize Form
  const checklistContainer = document.getElementById('qaChecklist');
  
  function renderChecklist() {
      checklistContainer.innerHTML = activeRules.map((rule, idx) => `
          <label class="rule-card">
              <input type="checkbox" class="rule-cb" onchange="calculateScore()">
              <span class="rule-text">${rule}</span>
          </label>
      `).join('');
      calculateScore();
  }

  // Listen for Radio Button Swaps
  document.querySelectorAll('input[name="aiMode"]').forEach(radio => {
      radio.addEventListener('change', (e) => {
          activeRules = ruleSets[e.target.value];
          renderChecklist();
      });
  });

  // Initial render
  renderChecklist();

  // 2. Score Calculator
  function calculateScore() {
      const checked = document.querySelectorAll('.rule-cb:checked').length;
      document.getElementById('liveScore').textContent = checked;
      
      const statusEl = document.getElementById('liveStatus');
      if (checked >= 9) { statusEl.textContent = "✅ EXCELLENT"; statusEl.style.color = "var(--mint-500)"; }
      else if (checked >= 6) { statusEl.textContent = "✅ APPROVED"; statusEl.style.color = "var(--mint-500)"; }
      else if (checked >= 4) { statusEl.textContent = "⚠️ NEEDS WORK"; statusEl.style.color = "var(--amber-400)"; }
      else { statusEl.textContent = "❌ UNUSABLE"; statusEl.style.color = "var(--coral-500)"; }
  }

  // 2.5 Search filter (names)
  function filterQueue() {
      const input = document.getElementById('inboxSearch');
      const term = input.value.trim().toLowerCase();
      document.getElementById('searchClear').style.display = term ? 'block' : 'none';

      const items = document.querySelectorAll('#videoInbox .vid-item');
      let visible = 0;
      items.forEach(el => {
          const match = !term || (el.dataset.name || '').includes(term);
          el.style.display = match ? '' : 'none';
          if (match) visible++;
      });

      const noMatch = document.getElementById('noMatchMsg');
      if (noMatch) noMatch.style.display = (items.length && !visible) ? 'block' : 'none';

      if (items.length) {
          document.getElementById('pendingCount').textContent = term ? `${visible} / ${items.length}` : items.length;
      }
  }

  function clearSearch() {
      const input = document.getElementById('inboxSearch');
      input.value = '';
      filterQueue();
      input.focus();
  }

  // 3. Load Pending Videos
  async function loadPendingQueue() {
      const inbox = document.getElementById('videoInbox');
      inbox.innerHTML = `<div style="padding: 30px; text-align: center; color: var(--text-muted);">Loading queue...</div>`;
      
      try {
          // Fetch videos that are explicitly 'pending' OR have no status yet
          const { data: vids, error } = await supabaseClient
              .from('video_submissions')
              .select('id, upload_date, video_file_url, created_at, employee_id, status, employees(name, badge_id)')
              .or('status.eq.pending,status.is.null')
              .order('created_at', { ascending: false });

          if (error) throw error;

          const queueCount = vids ? vids.length : 0;
          document.getElementById('pendingCount').textContent = queueCount;

          if (queueCount === 0) {
              inbox.innerHTML = `<div style="padding: 30px; text-align: center; color: var(--text-muted);">Queue is empty! 🎉</div>`;
              return;
          }

          inbox.innerHTML = vids.map(v => {
              const empName = v.employees?.name || 'Unknown Seller';
              const dateFmt = new Date(v.created_at).toLocaleDateString([], {month:'short', day:'numeric'});
              return `
              <div class="vid-item" id="vid-${v.id}" data-name="${escapeHtml(empName.toLowerCase())}" onclick="loadVideoToPlayer('${v.id}', '${v.video_file_url}', '${v.employee_id}', '${v.upload_date}')">
                  <div class="vid-thumb">▶</div>
                  <div class="vid-info">
                      <div class="vid-name">${escapeHtml(empName)}</div>
                      <div class="vid-meta">Uploaded: ${dateFmt}</div>
                  </div>
              </div>`;
          }).join('') + `<div class="no-match" id="noMatchMsg">No names match your search.</div>`;
          filterQueue(); // re-apply any active search after a reload
      } catch (err) {
          console.error("Queue load error:", err);
          inbox.innerHTML = `<div style="padding: 20px; color: var(--coral-500);">Error: ${err.message}</div>`;
      }
  }

 // 4. Load Video to Main View
  window.loadVideoToPlayer = function(vidId, fileUrl, empId, upDate) {
      document.querySelectorAll('.vid-item').forEach(el => el.classList.remove('active'));
      document.getElementById(`vid-${vidId}`).classList.add('active');

      activeVideoId = vidId;
      activeEmployeeId = empId;
      activeUploadDate = upDate;
      activeRawVideoUrl = fileUrl;
      
      resetForm();

      const player = document.getElementById('mainPlayer');
      document.getElementById('noVideoMsg').style.display = 'none';
      player.style.display = 'block';
      
      // Convert Google Drive URL to embeddable preview
      let embedUrl = fileUrl;
      const driveIdMatch = fileUrl.match(/[-\w]{25,}/);
      if (driveIdMatch) {
          embedUrl = `https://drive.google.com/file/d/${driveIdMatch[0]}/preview`;
      }
      
      player.src = embedUrl;
      
      // Enable both buttons
      document.getElementById('autoCheckBtn').disabled = false;
      document.getElementById('manualCheckBtn').disabled = false;
  };

  // 4.5 Reset Form Logic
  function resetForm() {
      document.querySelectorAll('.rule-cb').forEach(cb => cb.checked = false);
      const notesEl = document.getElementById('qaNotes');
      if (notesEl) notesEl.value = '';
      calculateScore();
  }

 // 5. Submit to Groq API (3-Mode Auto-Grading Engine)
  document.getElementById('autoCheckBtn').addEventListener('click', async () => {
      if (!activeVideoId) return;

      const btn = document.getElementById('autoCheckBtn');
      const manBtn = document.getElementById('manualCheckBtn');
      
      btn.disabled = true;
      manBtn.disabled = true;

      try {
        // Secure Local Key Storage
          let GROQ_API_KEY = localStorage.getItem('ewc_groq_key');
          if (!GROQ_API_KEY) {
              GROQ_API_KEY = prompt("Enter your Groq API Key to run the audit:");
              if (GROQ_API_KEY) {
                  localStorage.setItem('ewc_groq_key', GROQ_API_KEY);
              } else {
                  btn.disabled = false;
                  return;
              }
          }

          // REPLACE FROM HERE:
          const videoResponse = await fetch(activeRawVideoUrl);
          if (!videoResponse.ok) throw new Error("Failed to download video. Ensure it is hosted on Supabase.");
          const videoBlob = await videoResponse.blob();

          btn.textContent = 'EWC AI is transcribing...';
          const audioData = new FormData();
          audioData.append("file", videoBlob, "video.mp4");
          audioData.append("model", "whisper-large-v3-turbo");

          const whisperRes = await fetch('https://api.groq.com/openai/v1/audio/transcriptions', {
              method: 'POST',
              headers: { 'Authorization': `Bearer ${GROQ_API_KEY}` },
              body: audioData
          });
          const transcriptJson = await whisperRes.json();
          if (transcriptJson.error) throw new Error(transcriptJson.error.message);
          const actualTranscript = transcriptJson.text || "[No speech detected]";

          btn.textContent = 'EWC AI is grading...';
          const selectedMode = document.querySelector('input[name="aiMode"]:checked').value.toUpperCase();

          const brandContexts = {
              general: "Generic e-commerce product evaluation.",
              seoul: "Brand: Seoul Secrets. Products: Skincare, body lotion, sunscreen, whitening soap, bleaching products, face/body/hair care. AUDIENCE: Highly inclusive (Women, Men, LGBTQ+). Do NOT enforce gender norms. Judge favorably if the hook appeals universally.",
              momom: "Brand: Momom Foods. Products: Cereal krunch, chocolates, biscuits, wafer chocolates, candies, gummies. Focus on taste, craving satisfaction, and food appeal.",
              wowlinis: "Brand: WowLinis. Products: Home cleaning. Focus on effective stain removal, easy home maintenance, and cleanliness.",
              puti: "Brand: Puti Plus. Products: Laundry cleaning. Focus on bright whites, tough stain removal on clothes, and fresh scent.",
              coffee: "Brand: ME Coffee & Joco Coffee. Products: Chocolate coffee, black coffee, crema. Focus on morning energy, rich flavor, and brewing experience."
          };
          const selectedBrand = document.getElementById('brandContext').value;
          const targetContext = brandContexts[selectedBrand];

          const SYSTEM_PROMPT = `
          You are an AI Video Auditor. Evaluate the transcript against the following ${selectedMode} rubric.
          BRAND CONTEXT: ${targetContext}
          Ensure your evaluation and feedback respects this specific product category and target audience.
          
          VIDEO TRANSCRIPT: "${actualTranscript}"
          RUBRIC: ${activeRules.join('\n')}
          OUTPUT JSON: { "score": 0, "rules": [true,false,true,false,true,false,true,false,true,false], "feedback": "Max 400 chars." }
          `;

          const evalRes = await fetch('https://api.groq.com/openai/v1/chat/completions', {
              method: 'POST',
              headers: { 
                  'Content-Type': 'application/json',
                  'Authorization': `Bearer ${GROQ_API_KEY}`
              },
              body: JSON.stringify({
                  model: "openai/gpt-oss-20b",
                  messages: [{ role: "user", content: SYSTEM_PROMPT }],
                  response_format: { type: "json_object" },
                  temperature: 0 // <-- this line to enforce strict consistency
              })
          });

          const aiData = await evalRes.json();
          if (aiData.error) throw new Error(aiData.error.message);
          
          const analysis = JSON.parse(aiData.choices[0].message.content.replace(/```json|```/gi, '').trim());
          const maxScore = analysis.score || 0; 

          // ==========================================
          // STEP 3: DISPLAY AI DRAFT FOR HUMAN REVIEW
          // ==========================================
          btn.textContent = 'AI Draft Ready! Please Review.';
          
          const passedRules = analysis.rules || Array(10).fill(false);

          // Visually tick the checkboxes based on the AI rules
          const checkboxes = document.querySelectorAll('.rule-cb');
          passedRules.forEach((passed, idx) => {
              if (checkboxes[idx]) {
                  checkboxes[idx].checked = Boolean(passed);
                  checkboxes[idx].dispatchEvent(new Event('change')); 
              }
          });

          // Populate feedback box with the AI feedback
          const feedbackEl = document.getElementById('qaNotes');
          if (feedbackEl) feedbackEl.value = analysis.feedback || 'Evaluation completed.';

          // Enable Manual Save Button so the admin can review ALL videos (pass or fail)
          setTimeout(() => {
              btn.textContent = 'Re-Run AI Check';
              btn.disabled = false; 
              manBtn.disabled = false;
              manBtn.textContent = '💾 Save Final Verification';
              manBtn.classList.add('primary'); 
              btn.classList.remove('primary');
          }, 1500);

      } catch (err) {
          alert('AI Audit Failed:\n\n' + err.message);
          btn.disabled = false; 
          manBtn.disabled = false;
          btn.textContent = 'Auto AI Check';
      }
  });

  // 6. Universal Save Logic (Human Verification)
  document.getElementById('manualCheckBtn').addEventListener('click', async () => {
      if (!activeVideoId) return;
      const btn = document.getElementById('manualCheckBtn');
      const autoBtn = document.getElementById('autoCheckBtn');
      
      btn.disabled = true;
      autoBtn.disabled = true;
      btn.textContent = 'Saving Verified Score...';

      // Reads whatever is CURRENTLY checked on the screen (including human edits)
      const finalScore = document.querySelectorAll('.rule-cb:checked').length;
      const status = finalScore >= 6 ? 'approved' : 'rejected';
      const feedbackNotes = document.getElementById('qaNotes').value.trim() || 'Evaluation completed.';

      try {
          const { error: dbErr } = await supabaseClient
              .from('video_submissions')
              .update({ 
                  status: status,
                  ai_score: finalScore, 
                  ai_notes: feedbackNotes
              })
              .eq('id', activeVideoId);

          if (dbErr) throw dbErr;

         await supabaseClient.from('notifications').insert({
              employee_id: activeEmployeeId,
              title: `Video Audit Complete (${finalScore}/10)`,
              message: `Your video scored ${finalScore}/10. Status: ${status.toUpperCase()}. Feedback: "${feedbackNotes}"`,
              is_read: false
          });

          // NEW: Instantly delete the temporary video from Supabase to save space
          const filePath = activeRawVideoUrl.split('temp-ai-videos/')[1];
          if (filePath) {
              await supabaseClient.storage.from('temp-ai-videos').remove([filePath]);
          }

          btn.textContent = 'Saved Successfully!';
          btn.textContent = 'Saved Successfully!';
          
          // Clear screen and load next video
          setTimeout(() => {
              activeVideoId = null;
              document.getElementById('mainPlayer').src = '';
              document.getElementById('mainPlayer').style.display = 'none';
              document.getElementById('noVideoMsg').style.display = 'flex';
              
              // Reset buttons back to default UI state
              btn.textContent = 'Manual Check';
              btn.classList.remove('primary');
              autoBtn.textContent = 'Auto AI Check';
              autoBtn.classList.add('primary');
              
              resetForm();
              loadPendingQueue();
          }, 2000);

      } catch (err) {
          alert('Audit Save Failed:\n\n' + err.message);
          btn.textContent = 'Save Final Verification';
          btn.disabled = false;
          autoBtn.disabled = false;
      }
  });

  // 6.5 Auto-Generate Feedback based on Checkboxes
  document.getElementById('generateFeedbackBtn').addEventListener('click', async () => {
      const btn = document.getElementById('generateFeedbackBtn');
      const feedbackEl = document.getElementById('qaNotes');
      btn.textContent = 'Writing...';
      btn.disabled = true;

      // Build a summary of what the Human Checker flagged on the screen
      const checkboxes = document.querySelectorAll('.rule-cb');
      let passedRules = [];
      let failedRules = [];

      activeRules.forEach((rule, index) => {
          if (checkboxes[index].checked) {
              passedRules.push(rule);
          } else {
              failedRules.push(rule);
          }
      });

      const PROMPT = `
      You are a supportive QA Coach for EWC Creatives. 
      A video was just graded. 
      PASSED CRITERIA: ${passedRules.length > 0 ? passedRules.join(', ') : 'None'}
      FAILED CRITERIA: ${failedRules.length > 0 ? failedRules.join(', ') : 'None'}

      Write a short feedback note (Max 400 characters) in conversational Taglish.
      If they got 10/10, praise them.
      If they failed anything, gently explain what they need to fix based ONLY on the FAILED CRITERIA listed above.
      DO NOT include markdown, greetings, or JSON. Just write the direct message.
      `;

      try {
          let GROQ_API_KEY = localStorage.getItem('ewc_groq_key');
          if (!GROQ_API_KEY) throw new Error("Missing Groq API Key.");

          const evalRes = await fetch('https://api.groq.com/openai/v1/chat/completions', {
              method: 'POST',
              headers: { 
                  'Content-Type': 'application/json',
                  'Authorization': `Bearer ${GROQ_API_KEY}`
              },
              body: JSON.stringify({
                  model: "openai/gpt-oss-20b", 
                  messages: [{ role: "user", content: PROMPT }]
              })
          });

          const aiData = await evalRes.json();
          if (aiData.error) throw new Error(aiData.error.message);

          // Inject the AI's explanation directly into the text box
          feedbackEl.value = aiData.choices[0].message.content.trim();
          
      } catch (err) {
          alert('Failed to generate feedback: ' + err.message);
      } finally {
          btn.textContent = 'Auto-Write Feedback';
          btn.disabled = false;
      }
  });

  // 7. Helpers & Initialization
  function escapeHtml(str) {
      return String(str ?? '').replace(/[&<>"']/g, c => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
  }

  // Listen for real-time database changes
  supabaseClient
      .channel('video-qa-updates')
      .on(
          'postgres_changes',
          { event: '*', schema: 'public', table: 'video_submissions' },
          (payload) => {
              loadPendingQueue(); 
          }
      )
      .subscribe();

  // Boot up the queue a split-second after the page loads
  setTimeout(() => {
      loadPendingQueue();
  }, 500);
  
</script>
</body>
</html>
