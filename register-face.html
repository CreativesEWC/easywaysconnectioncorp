<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Face Enrollment Admin | EWC</title>
<link rel="icon" type="image/svg+xml" href="easyway_icon.svg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
<style>
  :root {
    --navy-950: #050812;
    --navy-900: #0a0f25;
    --navy-800: #121b3a;
    --navy-700: #1a2752;
    --line: #2a3b5c;
    --mint-500: #4fb286;
    --mint-700: #2f7a58;
    --amber-400: #f2b854;
    --coral-500: #d9614f;
    --paper: #ffffff;
    --text-muted: #7488b6;
    --font-display: 'Rockwell', Georgia, serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --font-mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--navy-950);
    color: var(--paper);
    font-family: var(--font-body);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: var(--navy-900);
    padding: 15px 24px;
    border-bottom: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .header-brand {
    font-family: var(--font-display);
    font-size: 20px;
    color: var(--mint-500);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .btn {
    background: var(--navy-800);
    border: 1px solid var(--line);
    color: var(--paper);
    padding: 8px 16px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    transition: 0.2s;
  }
  .btn:hover:not(:disabled) {
    border-color: var(--amber-400);
  }
  .btn.primary {
    background: var(--mint-500);
    color: var(--navy-950);
    border: none;
    font-weight: bold;
    padding: 12px 24px;
    font-size: 15px;
    width: 100%;
  }
  .btn.primary:hover:not(:disabled) {
    background: #5ec798;
  }
  .btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .main-wrapper {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px;
  }

  .enroll-card {
    background: var(--navy-900);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 30px;
    width: 100%;
    max-width: 640px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }

  .form-group {
    margin-bottom: 20px;
  }
  label {
    display: block;
    font-family: var(--font-mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    margin-bottom: 8px;
  }
  select {
    width: 100%;
    padding: 12px;
    background: var(--navy-800);
    border: 1px solid var(--line);
    color: var(--paper);
    border-radius: 8px;
    font-size: 14px;
    outline: none;
  }
  select:focus {
    border-color: var(--mint-500);
  }

  .camera-wrapper {
    position: relative;
    width: 100%;
    height: 380px;
    border-radius: 12px;
    overflow: hidden;
    background: #000;
    border: 2px solid var(--line);
    margin-bottom: 20px;
  }
  video, canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .status-banner {
    padding: 12px 16px;
    border-radius: 8px;
    background: var(--navy-800);
    border: 1px solid var(--line);
    font-size: 14px;
    text-align: center;
    margin-bottom: 20px;
    font-weight: 500;
  }

  .badge-status {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 4px;
    font-family: var(--font-mono);
    font-size: 11px;
    margin-left: 8px;
  }
  .badge-registered {
    background: rgba(79, 178, 134, 0.2);
    color: var(--mint-500);
    border: 1px solid var(--mint-500);
  }
  .badge-unregistered {
    background: rgba(242, 184, 84, 0.15);
    color: var(--amber-400);
    border: 1px solid var(--amber-400);
  }
</style>
</head>
<body>

<header>
  <div class="header-brand">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
      <circle cx="12" cy="7" r="4"></circle>
    </svg>
    Face Biometrics Enrollment
  </div>
  <div style="display: flex; gap: 10px;">
    <button class="btn" onclick="window.location.href='attendance-kiosk.html'">Open Kiosk</button>
    <button class="btn" onclick="window.location.href='dashboard-admin.html'">Admin Dashboard</button>
  </div>
</header>

<div class="main-wrapper">
  <div class="enroll-card">
    <div class="form-group">
      <label for="employeeSelect">
        Select Team Member
        <span id="empStatusBadge"></span>
      </label>
      <select id="employeeSelect" onchange="handleEmployeeChange()">
        <option value="">-- Loading employees... --</option>
      </select>
    </div>

    <div class="camera-wrapper">
      <video id="webcam" autoplay muted playsinline></video>
      <canvas id="overlay"></canvas>
    </div>

    <div id="statusBanner" class="status-banner" style="color: var(--amber-400);">
      Initializing AI face models...
    </div>

    <button id="captureBtn" class="btn primary" onclick="captureAndSaveFace()" disabled>
      📸 Capture & Register Face
    </button>
  </div>
</div>

<script src="supabase-config.js"></script>
<script>
  const videoEl = document.getElementById('webcam');
  const overlayEl = document.getElementById('overlay');
  const statusBanner = document.getElementById('statusBanner');
  const captureBtn = document.getElementById('captureBtn');
  const employeeSelect = document.getElementById('employeeSelect');
  const empStatusBadge = document.getElementById('empStatusBadge');

  let employeesList = [];
  let modelsLoaded = false;
  let cameraReady = false;

  async function init() {
    try {
      // 1. Load employees from Supabase
      await loadEmployees();

      // 2. Load face-api.js models
      statusBanner.textContent = "Loading AI facial detection models...";
      const MODEL_URL = 'https://justadudewhohacks.github.io/face-api.js/models/';
      await faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL);
      await faceapi.nets.faceLandmarkNet.loadFromUri(MODEL_URL);
      await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
      modelsLoaded = true;

      // 3. Start Webcam
      statusBanner.textContent = "Starting camera...";
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
      videoEl.srcObject = stream;
      videoEl.addEventListener('play', onVideoPlay);
    } catch (err) {
      console.error("Init error:", err);
      statusBanner.textContent = "❌ Error: " + err.message;
      statusBanner.style.color = "var(--coral-500)";
    }
  }

  async function loadEmployees() {
    const { data, error } = await supabaseClient
      .from('employees')
      .select('id, name, badge_id, face_descriptor')
      .order('name', { ascending: true });

    if (error) throw error;
    employeesList = data || [];

    if (employeesList.length === 0) {
      employeeSelect.innerHTML = '<option value="">No employees found in database</option>';
      return;
    }

    employeeSelect.innerHTML = '<option value="">-- Choose an employee to enroll --</option>' +
      employeesList.map(emp => {
        const isRegistered = Boolean(emp.face_descriptor);
        const label = `${emp.name}${emp.badge_id ? ' (' + emp.badge_id + ')' : ''} ${isRegistered ? '✓ [Registered]' : ''}`;
        return `<option value="${emp.id}">${escapeHtml(label)}</option>`;
      }).join('');
  }

  function handleEmployeeChange() {
    const selectedId = employeeSelect.value;
    const emp = employeesList.find(e => String(e.id) === String(selectedId));

    if (!emp) {
      empStatusBadge.innerHTML = '';
      captureBtn.disabled = true;
      return;
    }

    if (emp.face_descriptor) {
      empStatusBadge.innerHTML = '<span class="badge-status badge-registered">Already Registered (Will Overwrite)</span>';
      captureBtn.textContent = "🔄 Re-Capture & Update Face";
    } else {
      empStatusBadge.innerHTML = '<span class="badge-status badge-unregistered">Not Enrolled Yet</span>';
      captureBtn.textContent = "📸 Capture & Register Face";
    }

    updateButtonState();
  }

  function updateButtonState() {
    captureBtn.disabled = !(modelsLoaded && cameraReady && employeeSelect.value !== "");
  }

  function onVideoPlay() {
    cameraReady = true;
    statusBanner.textContent = "✅ Camera ready. Select a team member and look straight ahead.";
    statusBanner.style.color = "var(--mint-500)";
    updateButtonState();

    const displaySize = { width: videoEl.videoWidth, height: videoEl.videoHeight };
    faceapi.matchDimensions(overlayEl, displaySize);

    // Live face bounding-box preview so admin can confirm alignment before clicking Capture
    setInterval(async () => {
      if (!modelsLoaded || videoEl.paused || videoEl.ended) return;

      const detection = await faceapi.detectSingleFace(videoEl).withFaceLandmarks();
      const ctx = overlayEl.getContext('2d');
      ctx.clearRect(0, 0, overlayEl.width, overlayEl.height);

      if (detection) {
        const resized = faceapi.resizeResults(detection, displaySize);
        const box = resized.detection.box;
        const drawBox = new faceapi.draw.DrawBox(box, {
          label: 'Face Aligned',
          boxColor: '#4fb286'
        });
        drawBox.draw(overlayEl);
      }
    }, 300);
  }

  async function captureAndSaveFace() {
    const employeeId = employeeSelect.value;
    if (!employeeId) {
      alert("Please select an employee first.");
      return;
    }

    captureBtn.disabled = true;
    captureBtn.textContent = "Scanning facial features...";
    statusBanner.textContent = "Hold still, capturing biometric signature...";
    statusBanner.style.color = "var(--amber-400)";

    try {
      // Detect face + landmarks + 128-float descriptor
      const detection = await faceapi
        .detectSingleFace(videoEl)
        .withFaceLandmarks()
        .withFaceDescriptor();

      if (!detection) {
        throw new Error("No face detected! Ensure good lighting and look directly at the camera.");
      }

      // Convert Float32Array to standard JS array for JSON serialization
      const descriptorArray = Array.from(detection.descriptor);

      const { error } = await supabaseClient
        .from('employees')
        .update({ face_descriptor: JSON.stringify(descriptorArray) })
        .eq('id', employeeId);

      if (error) throw error;

      const emp = employeesList.find(e => String(e.id) === String(employeeId));
      const empName = emp ? emp.name : "Employee";

      statusBanner.textContent = `✅ Successfully enrolled ${empName}!`;
      statusBanner.style.color = "var(--mint-500)";

      // Refresh employee list to update [Registered] status
      await loadEmployees();
      employeeSelect.value = employeeId;
      handleEmployeeChange();

    } catch (err) {
      console.error("Enrollment failed:", err);
      statusBanner.textContent = "❌ " + err.message;
      statusBanner.style.color = "var(--coral-500)";
    } finally {
      updateButtonState();
    }
  }

  function escapeHtml(str) {
    return String(str ?? '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  init();
</script>
</body>
</html>
