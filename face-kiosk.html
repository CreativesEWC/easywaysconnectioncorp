<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>EWC Corp. Face Biometrics Kiosk</title>
<link rel="icon" type="image/svg+xml" href="easyway_icon.svg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<!-- Load face-api.js from CDN -->
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
<style>
  :root{
    --navy-950:#f4f4f5; --navy-900:#ffffff; --navy-800:#e4e4e7; --navy-700:#d4d4d8;
    --amber-500:#d97706; --amber-400:#b45309; --paper:#000000;
    --mint-500:#059669; --mint-700:#047857; --coral-500:#dc2626; --coral-700:#b91c1c; --line:#d4d4d8;
    --font-display:'Rockwell',Georgia,serif; --font-body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --font-mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; background:var(--navy-950); color:var(--paper); font-family:var(--font-body); }
  body{ overflow-y:auto; }
  .badge-strip{ background:repeating-linear-gradient(135deg,var(--navy-900),var(--navy-900) 12px,var(--navy-800) 12px,var(--navy-800) 24px); height:8px; width:100%; }
  #app{ min-height:100vh; display:flex; flex-direction:column; }

  #authGate{ flex:1; display:flex; align-items:center; justify-content:center; text-align:center; padding:40px; font-family:var(--font-mono); color:#9fb0d6; }

  #setupScreen{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:40px; gap:22px; }
  #setupScreen .eyebrow{ font-family:var(--font-mono); letter-spacing:.18em; text-transform:uppercase; color:var(--amber-400); font-size:14px; }
  #setupScreen h1{ font-family:var(--font-display); font-size:44px; margin:0; }
  #setupScreen p{ color:#52525b; font-size:16px; max-width:480px; line-height:1.5; }
  #setupScreen .setup-logo{ width:120px; height:120px; object-fit:contain; background:var(--paper); border-radius:20px; padding:14px; margin-bottom:6px; }
  #startKioskBtn{ margin-top:10px; padding:20px 48px; border:none; border-radius:14px; background:var(--mint-500); color:#ffffff; font-family:var(--font-display); font-size:20px; font-weight:700; cursor:pointer; }

  #kioskScreen{ flex:1; display:none; flex-direction:column; }
  #kioskScreen.active{ display:flex; }
  .kiosk-header{ padding:22px 36px 14px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); }
  .kiosk-header .brand{ display:flex; align-items:center; gap:14px; }
  .kiosk-header .brand-mark{ width:48px; height:48px; border-radius:10px; background:var(--paper); display:flex; align-items:center; justify-content:center; padding:6px; flex-shrink:0; }
  .kiosk-header .brand-mark img{ width:100%; height:100%; object-fit:contain; }
  .kiosk-header h1{ font-family:var(--font-display); font-size:22px; margin:0; }
  .kiosk-header .sub{ font-family:var(--font-mono); font-size:11px; color:var(--mint-500); letter-spacing:.1em; text-transform:uppercase; margin-top:2px; }
  .kiosk-header .clock{ text-align:right; font-family:var(--font-mono); }
  .kiosk-header .clock .time{ font-size:26px; font-weight:700; }
  .kiosk-header .clock .date{ font-size:12px; color:#52525b; }

  .scan-zone{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:24px; padding:24px; text-align:center; }
  .camera-frame{ position:relative; width:100%; max-width:460px; aspect-ratio:1/1; border-radius:24px; overflow:hidden; background:#000; border:3px solid var(--mint-500); box-shadow:0 0 0 10px rgba(5,150,105,0.06); flex-shrink:0; }
  .camera-frame video, .camera-frame canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }

  .instructions{ max-width:440px; }
  .instructions .icon{ font-size:44px; margin-bottom:8px; }
  .instructions h2{ font-family:var(--font-display); font-size:24px; margin:0 0 8px; color: #000; }
  .instructions p{ color:#52525b; font-size:14px; line-height:1.5; margin:0; }

  .kiosk-footer{ padding:14px 36px; text-align:center; font-family:var(--font-mono); font-size:11px; color:#4a5a85; border-top:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
  .kiosk-footer button{ background:none; border:1px solid var(--line); color:#4a5a85; border-radius:6px; padding:6px 12px; font-family:var(--font-mono); font-size:11px; cursor:pointer; }

  #confirmOverlay{ position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(6,10,22,0.88); backdrop-filter:blur(3px); z-index:50; }
  #confirmOverlay.show{ display:flex; }
  .badge-card{ width:440px; max-width:92vw; background:#ffffff; color:#000000; border-radius:20px; position:relative; overflow:hidden; box-shadow:0 30px 70px rgba(0,0,0,0.5); }
  .badge-top{ background:#f4f4f5; padding:18px 24px; display:flex; align-items:center; justify-content:space-between; border-bottom: 2px solid #000000; }
  .badge-top .co-name{ font-family:var(--font-mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:#000000; font-weight:700; }
  .badge-top .badge-id{ font-family:var(--font-mono); font-size:12px; color:#000000; font-weight:700; }
  .badge-body{ padding:24px 28px 8px; display:flex; gap:18px; align-items:center; }
  .avatar{ width:76px; height:76px; border-radius:50%; background:#ffffff; color:#000000; display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-size:26px; font-weight:700; flex-shrink:0; border:3px solid #000000; }
  .badge-name{ font-family:var(--font-display); font-size:23px; font-weight:700; line-height:1.15; color:#000000; }
  .badge-position{ font-family:var(--font-mono); font-size:12px; color:#000000; text-transform:uppercase; letter-spacing:.05em; margin-top:4px; font-weight:700; }
  .stamp-row{ display:flex; gap:12px; padding:16px 28px 22px; }
  .stamp-box{ flex:1; border:2px dashed #000000; border-radius:14px; padding:12px; text-align:center; position:relative; min-height:88px; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#fafafa; }
  .stamp-box .label{ font-family:var(--font-mono); font-size:9px; letter-spacing:.12em; text-transform:uppercase; color:#000000; margin-bottom:6px; font-weight:700; }
  .stamp-box .value{ font-family:var(--font-mono); font-size:12px; color:#000000; font-weight:700; }
  .stamp-mark{ font-family:var(--font-display); font-weight:700; font-size:18px; border:3px solid #000000; border-radius:8px; padding:5px 9px; display:inline-block; transform:rotate(-6deg); }
  .stamp-mark.in{ color:#059669; border-color:#059669; background:rgba(79,178,134,0.1); }
  .stamp-mark.out{ color:#dc2626; border-color:#dc2626; background:rgba(217,97,79,0.1); }
  .badge-message{ padding:0 28px 22px; font-size:14px; color:#000000; text-align:center; font-weight:600; }
  .birthday-banner{ text-align:center; font-family:var(--font-display); font-size:20px; font-weight:700; color:var(--coral-700); padding:4px 26px 0; }

  .kiosk-nav{
  position:fixed; top:16px; left:16px; right:16px; z-index:40;
  display:flex; gap:8px; flex-wrap:wrap; pointer-events:none;
}
.kiosk-nav .nav-btn{
  pointer-events:auto;
  background:var(--navy-900); color:var(--paper);
  border:1px solid var(--line); border-radius:8px;
  padding:8px 14px; font-family:var(--font-mono); font-size:11px;
  letter-spacing:.06em; text-transform:uppercase; cursor:pointer;
  box-shadow:0 2px 8px rgba(0,0,0,.12);
}
.kiosk-nav .nav-btn:hover{ border-color:var(--amber-500); color:var(--amber-400); }
.kiosk-nav .spacer{ flex:1; }
#kioskAdminBtn, #kioskRegisterBtn{ display:none; }   /* shown by JS for admins only */
  

  .badge-card.reject .badge-top{ background:#fee2e2; }
  .badge-card.reject .avatar{ background:#dc2626; border-color:#b91c1c; color:#fff; }
  .badge-card.reject .badge-name{ color:#dc2626; }
  .badge-card.birthday .badge-top{ background:linear-gradient(90deg,var(--amber-500),var(--coral-500)); }
</style>
</head>
<body>

<div class="badge-strip"></div>

  <div class="kiosk-nav">
  <button type="button" class="nav-btn" onclick="window.location.href='kiosk-live.html'">← Back</button>
  <div class="spacer"></div>
  <button type="button" class="nav-btn" id="kioskRegisterBtn" onclick="window.location.href='register-face.html'">Register Face</button>
  <button type="button" class="nav-btn" id="kioskAdminBtn" onclick="window.location.href='dashboard-admin.html'">Admin</button>
</div>
  
<div id="app">

  <div id="authGate">Checking biometric security gate...</div>

  <div id="setupScreen">
    <p class="eyebrow">Facial Biometric Terminal</p>
    <h1>EWC Face Kiosk</h1>
    <p>Click below to initialize AI face models and activate the recognition camera.</p>
    <button id="startKioskBtn">Launch Face Kiosk</button>
  </div>

  <div id="kioskScreen">
    <div class="kiosk-header">
      <div class="brand">
         <div class="brand-mark"><img src="easyway_icon.svg" alt="EWC"></div>
        <div>
          <h1>EWC Corp.</h1>
          <div class="sub">Face Biometrics</div>
        </div>
      </div>
      <div class="clock">
        <div class="time" id="clockTime">--:--:--</div>
        <div class="date" id="clockDate"></div>
      </div>
    </div>

    <div class="scan-zone">
      <div class="camera-frame">
        <video id="webcam" autoplay muted playsinline></video>
        <canvas id="overlay"></canvas>
      </div>
      <div class="instructions">
        <div class="icon">🙂</div>
        <h2 id="statusTitle">Look at the camera</h2>
        <p id="statusText">Stand about an arm's length away, face forward.</p>
      </div>
    </div>

    <div class="kiosk-footer">
      <span>EWC Corp. Face Biometrics</span>
      <button type="button" onclick="location.reload()">Restart</button>
    </div>
  </div>
</div>

<!-- Confirmation badge -->
<div id="confirmOverlay">
  <div class="badge-card" id="badgeCard"></div>
</div>

<script src="supabase-config.js"></script>

<script>
(async () => {
  const $ = id => document.getElementById(id);
  const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
  const MATCH_THRESHOLD   = 0.45;   // lower = stricter (0.4-0.5 is typical)
  const CONFIRM_FRAMES    = 3;      // same person must be matched this many frames in a row
  const REJECT_FRAMES     = 5;      // unknown face must persist this many frames before showing a reject card
  const COOLDOWN_MS       = 15000;  // same person ignored for 15s after a scan
  const REJECT_COOLDOWN_MS= 6000;   // reject card at most once every 6s
  const MIN_MINUTES_BEFORE_OUT = 5; // same rule as kiosk-live

  let matcher = null, employees = [], busy = false, streak = { label: null, n: 0 }, unknownStreak = 0, lastReject = 0;
  const recentScans = {};
  let dismissTimer = null;

  // ---------- helpers (same as kiosk-live) ----------
  function todayStr(){
    const d = new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  const nowIso = () => new Date().toISOString();
  function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function firstNameOnly(n){ return (String(n||'').trim().split(/\s+/)[0]) || ''; }
  function firstAndLast(n){
    const p = String(n||'').trim().split(/\s+/).filter(Boolean);
    const display = p.length > 1 ? p[0] + ' ' + p[p.length-1] : (p[0] || '');
    const initials = ((p[0]||'?')[0] + (p.length > 1 ? p[p.length-1][0] : '')).toUpperCase();
    return { display, initials };
  }
  function isBirthdayToday(b){
    if(!b) return false;
    const d = new Date(b + 'T00:00:00'), n = new Date();
    return d.getMonth() === n.getMonth() && d.getDate() === n.getDate();
  }
  function speak(t){ try{ if(!('speechSynthesis' in window)) return; window.speechSynthesis.cancel(); window.speechSynthesis.speak(new SpeechSynthesisUtterance(t)); }catch(e){} }
  function daypart(){ const h = new Date().getHours(); return h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening'; }

  // ---------- late / OT (copied from kiosk-live) ----------
  function calculateDynamicShiftHours(inStr, outStr, startStr, endStr){
    const tin = new Date(inStr), tout = new Date(outStr);
    const ss = new Date(inStr); const [sh, sm] = startStr.split(':'); ss.setHours(parseInt(sh), parseInt(sm), 0, 0);
    const se = new Date(outStr); const [eh, em] = endStr.split(':'); se.setHours(parseInt(eh), parseInt(em), 0, 0);
    let late = 0, ot = 0;
    if (tin > ss) late = Math.ceil(((tin - ss) / 60000) / 5) * 5;
    if (tout > se) ot = Math.floor(((tout - se) / 60000) / 30) * 30;
    return { latePenalty: late, earnedOt: ot };
  }
  function calculateFixedShiftHours(inStr, outStr){
    const tin = new Date(inStr), tout = new Date(outStr);
    const ss = new Date(inStr); ss.setHours(9, 0, 0, 0);
    const se = new Date(outStr); se.setHours(18, 0, 0, 0);
    let late = 0, ot = 0;
    if (tin > ss) late = Math.ceil(((tin - ss) / 60000) / 5) * 5;
    if (tout > se) ot = Math.floor(((tout - se) / 60000) / 30) * 30;
    return { latePenalty: late, earnedOt: ot };
  }

  // ---------- clock ----------
  setInterval(() => {
    const n = new Date();
    $('clockTime').textContent = n.toLocaleTimeString();
    $('clockDate').textContent = n.toLocaleDateString(undefined, { weekday:'long', year:'numeric', month:'short', day:'numeric' });
  }, 1000);

  // ---------- auth gate ----------
  $('setupScreen').style.display = 'none';
  let me = null;
  try {
    me = await getMyEmployeeRecord();
    if (!me) { window.location.href = 'login.html'; return; }
    $('authGate').style.display = 'none';
    $('setupScreen').style.display = 'flex';
    if (['admin','dev','president'].includes(String(me.role||'').toLowerCase().trim())) {
      $('kioskAdminBtn').style.display = 'inline-block';
      $('kioskRegisterBtn').style.display = 'inline-block';
    }
  } catch (e) {
    $('authGate').textContent = 'Auth check failed: ' + e.message;
    return;
  }

  // ---------- start ----------
  $('startKioskBtn').addEventListener('click', async () => {
    const btn = $('startKioskBtn');
    btn.disabled = true;
    try {
      if ('speechSynthesis' in window) { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; window.speechSynthesis.speak(u); }
      btn.textContent = 'Loading AI models...';
      await faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL);
      await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
      await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);

      btn.textContent = 'Loading enrolled faces...';
      await loadEnrolledFaces();

      btn.textContent = 'Starting camera...';
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
      const video = $('webcam');
      video.srcObject = stream;
      await video.play();

      $('setupScreen').style.display = 'none';
      $('kioskScreen').classList.add('active');
      recognitionLoop();
    } catch (err) {
      console.error(err);
      btn.disabled = false;
      btn.textContent = 'Launch Face Kiosk';
      alert('Could not start kiosk: ' + err.message);
    }
  });

  async function loadEnrolledFaces() {
    const { data, error } = await supabaseClient
      .from('employees')
      .select('*, positions(name)')
      .not('face_descriptor', 'is', null);
    if (error) throw error;

    employees = data || [];
    const labeled = [];
    for (const emp of employees) {
      try {
        const arr = typeof emp.face_descriptor === 'string' ? JSON.parse(emp.face_descriptor) : emp.face_descriptor;
        if (!Array.isArray(arr) || arr.length !== 128) throw new Error('bad length');
        labeled.push(new faceapi.LabeledFaceDescriptors(String(emp.id), [new Float32Array(arr)]));
      } catch (e) { console.warn('Bad descriptor for', emp.name); }
    }
    if (!labeled.length) throw new Error('No enrolled faces found. Register faces first.');
    matcher = new faceapi.FaceMatcher(labeled, MATCH_THRESHOLD);
  }

  // ---------- recognition loop ----------
  async function recognitionLoop() {
    const video = $('webcam'), canvas = $('overlay');
    const size = { width: video.videoWidth, height: video.videoHeight };
    faceapi.matchDimensions(canvas, size);

    setInterval(async () => {
      if (busy || video.paused) return;
      const ctx = canvas.getContext('2d');
      let det;
      try { det = await faceapi.detectSingleFace(video).withFaceLandmarks().withFaceDescriptor(); }
      catch (e) { return; }
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (!det) {
        streak = { label: null, n: 0 }; unknownStreak = 0;
        $('statusTitle').textContent = 'Look at the camera';
        return;
      }
      const resized = faceapi.resizeResults(det, size);
      const best = matcher.findBestMatch(det.descriptor);
      const known = best.label !== 'unknown';
      new faceapi.draw.DrawBox(resized.detection.box, {
        label: known ? 'Recognized' : 'Unknown',
        boxColor: known ? '#059669' : '#dc2626'
      }).draw(canvas);

      // ---- UNREGISTERED / UNKNOWN FACE: never writes to the database ----
      if (!known) {
        streak = { label: null, n: 0 };
        unknownStreak++;
        $('statusTitle').textContent = 'Face not recognized';
        if (unknownStreak >= REJECT_FRAMES && Date.now() - lastReject > REJECT_COOLDOWN_MS) {
          lastReject = Date.now(); unknownStreak = 0;
          showCard(renderRejectCard(), true, 3000);
          speak('Face not registered.');
        }
        return;
      }
      unknownStreak = 0;

      // ---- require the same person in several consecutive frames ----
      if (streak.label === best.label) streak.n++; else streak = { label: best.label, n: 1 };
      if (streak.n < CONFIRM_FRAMES) { $('statusTitle').textContent = 'Verifying...'; return; }

      const emp = employees.find(e => String(e.id) === best.label);
      if (!emp) return;

      const now = Date.now();
      if (recentScans[emp.id] && now - recentScans[emp.id] < COOLDOWN_MS) return;
      recentScans[emp.id] = now;
      streak = { label: null, n: 0 };

      busy = true;
      try { await recordAttendance(emp); }
      catch (e) {
        console.error(e);
        delete recentScans[emp.id];
        showCard(`<div class="badge-top"><span class="co-name">System Error</span></div>
          <div class="badge-body" style="justify-content:center"><div class="badge-name">Operation Failed</div></div>
          <div class="badge-message">${esc(e.message)}</div>`, true, 6000);
      }
      finally { busy = false; }
    }, 700);
  }

  // ---------- attendance: SAME RULES AS kiosk-live handleScan ----------
  async function recordAttendance(emp) {
    const today = todayStr();

    const { data: latestShift, error: shiftErr } = await supabaseClient
      .from('attendance_logs').select('*')
      .eq('employee_id', emp.id)
      .order('time_in', { ascending: false })
      .limit(1).maybeSingle();
    if (shiftErr) throw new Error('DB Error fetching shift: ' + shiftErr.message);

    let row, kind;
    let isGhostShift = false;
    if (latestShift && latestShift.time_in && !latestShift.time_out) {
      const hoursOpen = (Date.now() - new Date(latestShift.time_in).getTime()) / 3600000;
      if (hoursOpen > 18) isGhostShift = true;
    }

    if (latestShift && latestShift.time_in && !latestShift.time_out && !isGhostShift) {
      // already timed in -> guard against an instant Time Out (e.g. just scanned by barcode)
      const minutesOpen = (Date.now() - new Date(latestShift.time_in).getTime()) / 60000;
      if (minutesOpen < MIN_MINUTES_BEFORE_OUT) {
        showCard(`<div class="badge-top"><span class="co-name">Easy Ways Connection Corp.</span><span class="badge-id">${esc(emp.badge_id)}</span></div>
          <div class="badge-body"><div><div class="badge-name">ALREADY TIMED IN</div><div class="badge-position">Attendance Confirmed</div></div></div>
          <div class="badge-message">Your Time In was just recorded. Have a great shift!</div>`, false, 3000);
        speak('Already verified.');
        return;
      }

      const exactTimeOut = nowIso();
      const payload = { time_out: exactTimeOut };
      const posName = emp.positions ? emp.positions.name : '';

      if (posName === 'Multimedia Artist' || posName === 'RTS Admin') {
        const d = calculateFixedShiftHours(latestShift.time_in, exactTimeOut);
        payload.late_penalty_minutes = d.latePenalty; payload.earned_ot_minutes = d.earnedOt;
      } else if (posName === 'Live Seller' || posName === 'CSR' || posName === 'Customer Service Representative') {
        const table = (posName === 'Live Seller') ? 'live_seller_schedule' : 'csr_schedules';
        const { data: sched } = await supabaseClient.from(table)
          .select('shift_start, shift_end').eq('employee_id', emp.id).eq('schedule_date', today).maybeSingle();
        if (sched && sched.shift_start && sched.shift_end) {
          const d = calculateDynamicShiftHours(latestShift.time_in, exactTimeOut, sched.shift_start, sched.shift_end);
          payload.late_penalty_minutes = d.latePenalty; payload.earned_ot_minutes = d.earnedOt;
        }
      }

      const { data: updated, error: updErr } = await supabaseClient
        .from('attendance_logs').update(payload).eq('id', latestShift.id).select().single();
      if (updErr) throw new Error('DB Error updating Time Out: ' + updErr.message);
      row = updated; kind = 'out';
    }
    else if (latestShift && latestShift.log_date === today && latestShift.time_out) {
      // already completed today -> NO new row (prevents duplicate Time In)
      row = latestShift; kind = 'complete';
    }
    else {
      const { data: inserted, error: insErr } = await supabaseClient
        .from('attendance_logs').insert({ employee_id: emp.id, log_date: today, time_in: nowIso() })
        .select().single();
      if (insErr) throw new Error('DB Error saving Time In: ' + insErr.message);
      row = inserted; kind = 'in';
    }

    const birthday = isBirthdayToday(emp.birthday);
    showCard(renderAcceptedCard(emp, row, kind, birthday), false, birthday ? 6000 : 4000, birthday ? 'birthday' : '');
    const who = firstNameOnly(emp.name);
    if (birthday) speak(`Happy birthday, ${who}!`);
    else if (kind === 'in') speak(`${daypart()}, ${who}. Time in recorded.`);
    else if (kind === 'out') speak(`${daypart()}, ${who}. Time out recorded.`);
    else speak(`${who}, you already completed your attendance for today.`);
  }

  // ---------- cards ----------
  function showCard(html, isReject, autoMs, extra){
    const overlay = $('confirmOverlay'), card = $('badgeCard');
    card.className = 'badge-card' + (isReject ? ' reject' : '') + (extra ? ' ' + extra : '');
    card.innerHTML = html;
    overlay.classList.add('show');
    clearTimeout(dismissTimer);
    dismissTimer = setTimeout(() => overlay.classList.remove('show'), autoMs || 4000);
  }
  $('confirmOverlay').addEventListener('click', () => { clearTimeout(dismissTimer); $('confirmOverlay').classList.remove('show'); });

  function renderAcceptedCard(emp, row, kind, birthday){
    const { display, initials } = firstAndLast(emp.name);
    const fmt = t => new Date(t).toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit', hour12:true });
    const inVal  = row.time_in  ? `<div class="stamp-mark in">IN · ${fmt(row.time_in)}</div>`   : `<div class="value">— not yet —</div>`;
    const outVal = row.time_out ? `<div class="stamp-mark out">OUT · ${fmt(row.time_out)}</div>` : `<div class="value">— not yet —</div>`;
    const message = kind === 'in' ? 'Time In recorded. See you later today!'
                  : kind === 'out' ? 'Time Out recorded. Have a good rest!'
                  : 'Attendance already completed for today.';
    const pos = emp.positions ? emp.positions.name : '';
    const bday = birthday ? `<div class="birthday-banner">🎉 Happy Birthday, ${esc(firstNameOnly(emp.name))}! 🎂</div>` : '';
    let avatar = esc(initials);
    if (emp.avatar_url) {
      const url = emp.avatar_url.startsWith('http') ? emp.avatar_url
        : supabaseClient.storage.from('avatars').getPublicUrl(emp.avatar_url).data.publicUrl;
      avatar = `<img src="${esc(url)}" alt="${esc(display)}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`;
    }
    return `
      <div class="badge-top"><span class="co-name">Easy Ways Connection Corp.</span><span class="badge-id">${esc(emp.badge_id)}</span></div>
      ${bday}
      <div class="badge-body">
        <div class="avatar" style="padding:0;overflow:hidden;">${avatar}</div>
        <div><div class="badge-name">${esc(display)}</div><div class="badge-position">${esc(pos)}</div></div>
      </div>
      <div class="stamp-row">
        <div class="stamp-box"><div class="label">Time In</div>${inVal}</div>
        <div class="stamp-box"><div class="label">Time Out</div>${outVal}</div>
      </div>
      <div class="badge-message">${message}</div>`;
  }

  function renderRejectCard(){
    return `
      <div class="badge-top"><span class="co-name">Easy Ways Connection Corp.</span><span class="badge-id">Not recognized</span></div>
      <div class="badge-body" style="flex-direction:column;text-align:center;padding-top:30px;">
        <div class="avatar">✕</div>
        <div><div class="badge-name">Face Not Registered</div></div>
      </div>
      <div class="badge-message">No match on file. Please see an administrator, or use your badge on the barcode kiosk.</div>`;
  }
})();
</script>
</body>
</html>
