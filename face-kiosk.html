<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>EWC Corp. Face Biometrics Kiosk</title>
<link rel="icon" type="image/svg+xml" href="easyway_icon.svg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<!-- Load face-api.js from CDN -->
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
<style>
  :root{
    --navy-950:#f4f4f5; --navy-900:#ffffff; --navy-800:#e4e4e7; --navy-700:#d4d4d8;
    --amber-500:#d97706; --amber-400:#b45309; --paper:#000000;
    --mint-500:#059669; --mint-700:#047857; --coral-500:#dc2626; --coral-700:#b91c1c; --line:#d4d4d8;
    --font-display:'Rockwell',Georgia,serif; --font-body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --font-mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; background:var(--navy-950); color:var(--paper); font-family:var(--font-body); }
  body{ overflow-y:auto; }
  .badge-strip{ background:repeating-linear-gradient(135deg,var(--navy-900),var(--navy-900) 12px,var(--navy-800) 12px,var(--navy-800) 24px); height:8px; width:100%; }
  #app{ min-height:100vh; display:flex; flex-direction:column; }

  #authGate{ flex:1; display:flex; align-items:center; justify-content:center; text-align:center; padding:40px; font-family:var(--font-mono); color:#9fb0d6; }

  #setupScreen{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:40px; gap:22px; }
  #setupScreen .eyebrow{ font-family:var(--font-mono); letter-spacing:.18em; text-transform:uppercase; color:var(--amber-400); font-size:14px; }
  #setupScreen h1{ font-family:var(--font-display); font-size:44px; margin:0; }
  #setupScreen p{ color:#52525b; font-size:16px; max-width:480px; line-height:1.5; }
  #setupScreen .setup-logo{ width:120px; height:120px; object-fit:contain; background:var(--paper); border-radius:20px; padding:14px; margin-bottom:6px; }
  #startKioskBtn{ margin-top:10px; padding:20px 48px; border:none; border-radius:14px; background:var(--mint-500); color:#ffffff; font-family:var(--font-display); font-size:20px; font-weight:700; cursor:pointer; }

  #kioskScreen{ flex:1; display:none; flex-direction:column; }
  #kioskScreen.active{ display:flex; }
  .kiosk-header{ padding:22px 36px 14px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); }
  .kiosk-header .brand{ display:flex; align-items:center; gap:14px; }
  .kiosk-header .brand-mark{ width:48px; height:48px; border-radius:10px; background:var(--paper); display:flex; align-items:center; justify-content:center; padding:6px; flex-shrink:0; }
  .kiosk-header .brand-mark img{ width:100%; height:100%; object-fit:contain; }
  .kiosk-header h1{ font-family:var(--font-display); font-size:22px; margin:0; }
  .kiosk-header .sub{ font-family:var(--font-mono); font-size:11px; color:var(--mint-500); letter-spacing:.1em; text-transform:uppercase; margin-top:2px; }
  .kiosk-header .clock{ text-align:right; font-family:var(--font-mono); }
  .kiosk-header .clock .time{ font-size:26px; font-weight:700; }
  .kiosk-header .clock .date{ font-size:12px; color:#52525b; }

  .scan-zone{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:24px; padding:24px; text-align:center; }
  .camera-frame{ position:relative; width:100%; max-width:460px; aspect-ratio:1/1; border-radius:24px; overflow:hidden; background:#000; border:3px solid var(--mint-500); box-shadow:0 0 0 10px rgba(5,150,105,0.06); flex-shrink:0; }
  .camera-frame video, .camera-frame canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }

  .instructions{ max-width:440px; }
  .instructions .icon{ font-size:44px; margin-bottom:8px; }
  .instructions h2{ font-family:var(--font-display); font-size:24px; margin:0 0 8px; color: #000; }
  .instructions p{ color:#52525b; font-size:14px; line-height:1.5; margin:0; }

  .kiosk-footer{ padding:14px 36px; text-align:center; font-family:var(--font-mono); font-size:11px; color:#4a5a85; border-top:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
  .kiosk-footer button{ background:none; border:1px solid var(--line); color:#4a5a85; border-radius:6px; padding:6px 12px; font-family:var(--font-mono); font-size:11px; cursor:pointer; }

  #confirmOverlay{ position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(6,10,22,0.88); backdrop-filter:blur(3px); z-index:50; }
  #confirmOverlay.show{ display:flex; }
  .badge-card{ width:440px; max-width:92vw; background:#ffffff; color:#000000; border-radius:20px; position:relative; overflow:hidden; box-shadow:0 30px 70px rgba(0,0,0,0.5); }
  .badge-top{ background:#f4f4f5; padding:18px 24px; display:flex; align-items:center; justify-content:space-between; border-bottom: 2px solid #000000; }
  .badge-top .co-name{ font-family:var(--font-mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:#000000; font-weight:700; }
  .badge-top .badge-id{ font-family:var(--font-mono); font-size:12px; color:#000000; font-weight:700; }
  .badge-body{ padding:24px 28px 8px; display:flex; gap:18px; align-items:center; }
  .avatar{ width:76px; height:76px; border-radius:50%; background:#ffffff; color:#000000; display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-size:26px; font-weight:700; flex-shrink:0; border:3px solid #000000; }
  .badge-name{ font-family:var(--font-display); font-size:23px; font-weight:700; line-height:1.15; color:#000000; }
  .badge-position{ font-family:var(--font-mono); font-size:12px; color:#000000; text-transform:uppercase; letter-spacing:.05em; margin-top:4px; font-weight:700; }
  .stamp-row{ display:flex; gap:12px; padding:16px 28px 22px; }
  .stamp-box{ flex:1; border:2px dashed #000000; border-radius:14px; padding:12px; text-align:center; position:relative; min-height:88px; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#fafafa; }
  .stamp-box .label{ font-family:var(--font-mono); font-size:9px; letter-spacing:.12em; text-transform:uppercase; color:#000000; margin-bottom:6px; font-weight:700; }
  .stamp-box .value{ font-family:var(--font-mono); font-size:12px; color:#000000; font-weight:700; }
  .stamp-mark{ font-family:var(--font-display); font-weight:700; font-size:18px; border:3px solid #000000; border-radius:8px; padding:5px 9px; display:inline-block; transform:rotate(-6deg); }
  .stamp-mark.in{ color:#059669; border-color:#059669; background:rgba(79,178,134,0.1); }
  .stamp-mark.out{ color:#dc2626; border-color:#dc2626; background:rgba(217,97,79,0.1); }
  .badge-message{ padding:0 28px 22px; font-size:14px; color:#000000; text-align:center; font-weight:600; }
  .birthday-banner{ text-align:center; font-family:var(--font-display); font-size:20px; font-weight:700; color:var(--coral-700); padding:4px 26px 0; }
</style>
</head>
